name: Phayra v9.0.51 NSE Archive Recovery TEST

on:
  push:
    branches:
      - v9051-nse-archive-recovery-20261124
  pull_request:
    branches:
      - main
      - v9050-master-session-validation-20261124
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Generate required official AMFI classification asset
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check openpyxl==3.1.5
          python tools/fetch_amfi_market_cap.py --output app/src/main/assets/amfi_market_cap_categories.csv --metadata build/amfi-market-cap-source.txt
          test -s app/src/main/assets/amfi_market_cap_categories.csv
          cat build/amfi-market-cap-source.txt
      - name: Frozen trading parity and research-only price/P-E sourcing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, subprocess
          base="c73755439d35929de01470e5c38161a317e824b0"
          root=pathlib.Path("app/src/main/java/com/multify/traderpro")
          # Frozen selection, confirmation, transport-research decision and trailing MUST be byte-identical.
          locked=[
            "data/repository/TradingRepository.kt", "engine/HardStopLossPolicy.kt",
            "engine/GttProtectionReadinessPolicy.kt",
                        "data/repository/LowPeResearchPolicy.kt", "data/repository/EquityLowValuationStore.kt",
            "engine/SwingPullbackResearchPolicy.kt",
            "engine/LargeCapEquityResearchPolicy.kt",
            "data/repository/LargeWatchLearningStore.kt",
            "data/repository/LargeWatchFeaturePolicy.kt",
            "data/repository/LargeIndexResearchPolicy.kt",
            "engine/FixedWorkingRangeShadowPolicy.kt",
            "data/repository/AmfiMarketCapClassification.kt",
            "engine/AdaptiveLowCandleEvidence.kt",
            "data/repository/AdaptiveLowResearchStore.kt",
            "service/TradingEngineService.kt",
            "ui/screens/FixedLiteApp.kt", "ui/screens/TraderViewModel.kt",
            "engine/WorkingRangeCandidatePolicy.kt",
            "engine/WorkingRangeEntryMomentumPolicy.kt",
            "engine/WorkingRangeAutoBuyPolicy.kt",
            "engine/WorkingRangeExitPolicy.kt",
            "data/logging/WorkingRangeRecommendationStore.kt",
            "engine/FixedFinalContract.kt", "engine/FixedLocalStrategyEngine.kt",
            "engine/FixedForecastPublicationPolicy.kt", "engine/FixedForecastQualityPolicy.kt",
            "engine/FixedMarketDiscoveryPolicy.kt", "engine/FixedRepeatQualificationPolicy.kt",
            "engine/FixedCategoryAccountRoutingPolicy.kt", "engine/FixedBetaDetailCycleCapacityPolicy.kt",
            "engine/SteppedTrailingPolicy.kt", "data/network/BetaReadOnlyInterceptor.kt",
            "engine/FixedResearchCapacityPolicy.kt", "engine/FixedHistoricalWindowStore.kt",
            "data/network/GrowwHistoricalThrottlePolicy.kt"
          ]
          def normalize_eod_backup_only(raw):
            text=raw.decode()
            text=text.replace('            "eod_research_history.jsonl",\n','')
            restore_start=text.index('        restoreStage = "NSE EOD research history"\n')
            restore_end=text.index('        val gson = GsonBuilder().disableHtmlEscaping().create()',restore_start)
            text=text[:restore_start]+text[restore_end:]
            text=text.replace('                equityEodResearch.appendPortableHistory(zip)\n                written("eod_research_history.jsonl")\n','')
            text=text.replace('        val pendingEntryIncludingWorkingRange = pendingEntry ||\n            workingRangeRecommendationStore.pendingAutoBuyIntents().isNotEmpty()\n','')
            text=text.replace('pendingEntry = pendingEntryIncludingWorkingRange,','pendingEntry = pendingEntry,')
            text=text.replace('                "broker_holdings_count" to inventory.holdings.size,\n                "broker_positions_count" to inventory.positions.size,\n                "broker_active_gtt_count" to (activeGttsResult.getOrNull()?.values?.sumOf { it.size } ?: -1),\n                "idle_broker_recheck_interval_ms" to idleRecheckIntervalMs,\n                "pending_entry_including_working_range" to pendingEntryIncludingWorkingRange\n','')
            text=text.replace('                "legacy_recovery_rows" to marked.count { it.smartOrderMode == HoldingSmartOrderPolicy.MODE_RECOVERY_GTT },','                "legacy_recovery_rows" to marked.count { it.smartOrderMode == HoldingSmartOrderPolicy.MODE_RECOVERY_GTT }')
            text=text.replace('private const val EMPTY_PORTFOLIO_BROKER_RECHECK_MS = 300_000L','private const val EMPTY_PORTFOLIO_BROKER_RECHECK_MS = 180_000L')
            text=text.replace('private const val NONEMPTY_EXTERNAL_BROKER_RECHECK_MS = 300_000L','private const val NONEMPTY_EXTERNAL_BROKER_RECHECK_MS = 45_000L')
            return text.encode()
          for rel in locked:
            path=root/rel
            current=path.read_bytes()
            if rel=="data/repository/TradingRepository.kt":
              current=normalize_eod_backup_only(current)
            expected=subprocess.check_output(["git","show",f"{base}:{path.as_posix()}"])
            assert current==expected, "FROZEN_SOURCE_CHANGED "+rel
          hard=(root/"engine/HardStopLossPolicy.kt").read_text()
          integrity=(root/"engine/ReleaseIntegrityManifest.kt").read_text()
          readiness=(root/"engine/GttProtectionReadinessPolicy.kt").read_text()
          repo=(root/"data/repository/TradingRepository.kt").read_text()
          build=pathlib.Path("app/build.gradle.kts").read_text()
          assert "const val MAX_LOSS_PCT = 2.0" in hard
          assert "const val HARD_STOP_LOSS_PCT = 2.0" in integrity
          assert "brokerStatusOrUnverified(rawStatus: String?)" in readiness
          assert '"UNVERIFIED"' in readiness
          assert "GTT_CREATE_ACK_ID_MISSING_RECONCILE_ONLY" in repo
          assert 'payload.status.ifBlank { "ACTIVE" }' not in repo
          assert 'recovered.payload.status.ifBlank { "ACTIVE" }' not in repo
          assert "versionCode = 9051" in build
          assert 'applicationIdSuffix = ".v9051test"' in build
          assert "fixed_auto_buy_enabled" not in build
          equity=(root/"data/repository/EquityEodResearchRepository.kt").read_text()
          pe=(root/"data/repository/LowPeResearchPolicy.kt").read_text()
          swing=(root/"engine/SwingPullbackResearchPolicy.kt").read_text()
          assert "refreshValuationAfterHours()" in equity
          assert "NSE_PE_URL" in equity and "NSE_TOTAL_MARKET_INDUSTRIES_URL" in equity
          assert "requireAfterHours()" in equity
          assert "groww_api_calls" in equity
          assert "marketIndustryCoverageComplete" in pe
          assert "verifiedIndustryPeMinimum" in equity
          assert "distantPullback" in swing and "ema20" in swing
          large=(root/"data/repository/EquityEodResearchRepository.kt").read_text()
          policy=(root/"data/repository/LargeWatchFeaturePolicy.kt").read_text()
          learning=(root/"data/repository/LargeWatchLearningStore.kt").read_text()
          ui=(root/"ui/screens/EquityResearchScreens.kt").read_text()
          assert "refreshLargeIndexEodAfterHours()" in large
          assert "requireAfterHours()" in large
          assert "LargeWatchFeaturePolicy.build" in large
          assert "largeWatchStore.record" in large
          assert "largeWatchStore.resolveEvent" in large
          assert "val METRICS = listOf" in policy
          assert '"stock_pb" to null' in policy
          assert "MIN_EVENTS = 100" in learning and "MIN_DAYS = 20" in learning
          assert "wilsonLower" in learning
          assert "Other monitored large caps" not in ui
          assert "Live large-cap breadth PROXY" in ui
          assert "Stock P/B unverified" in ui
          low=(root/"engine/AdaptiveLowPatternPolicy.kt").read_text()
          store=(root/"data/repository/AdaptiveLowResearchStore.kt").read_text()
          assert "NEAR_SUPPORT_MAX_PCT = 5.0" in low
          assert "MIN_PRIOR_REACTIONS = 2" in low
          assert "FULL_REBOUND_HORIZON_SESSIONS = 10" in low
          assert "distance >= NEAR_SUPPORT_MAX_PCT" in low
          assert "return null" in low
          assert "refreshAdaptiveLowsAfterHours()" in equity
          assert "refreshExistingOhlcAfterHours" in equity
          assert "requireAfterHours()" in equity
          assert "NSE_BHAVCOPY_OFF_MARKET_ONLY" in equity
          assert "adaptiveLowStore.saveDay" in equity
          assert "adaptiveLowStore.resolve" in equity
          assert "FULL_HORIZON_SESSIONS=10" in store
          assert "MIN_MATURED=100" in store
          assert "find previous support" in ui.lower() or "previous support levels" in ui.lower()
          # Preserve existing trend/sector research formulas unchanged except
          # the addition of optional OHLC fields on the source EOD bar.
          large_new=(root/"engine/LargeCapEquityResearchPolicy.kt").read_text()
          large_old=subprocess.check_output(["git","show",
            f"{base}:app/src/main/java/com/multify/traderpro/engine/LargeCapEquityResearchPolicy.kt"]).decode()
          assert large_new.split("data class SixMonthLowObservation(",1)[1] == large_old.split("data class SixMonthLowObservation(",1)[1]
          # The old misleading near-low table is no longer rendered.
          assert "AdaptiveLowOpportunityRow" in ui
          assert "low-cap-large" in ui and "low-cap-mid" in ui and "low-cap-small" in ui
          assert "CURRENT_BULLISH_CANDLE" in store
          vm=(root/"ui/screens/TraderViewModel.kt").read_text()
          assert "run.qualifiedPatterns" in vm
          inst=(root/"engine/InstitutionalIntelligencePolicy.kt").read_text()
          inst_ui=(root/"ui/screens/InstitutionalResearchScreen.kt").read_text()
          nav=(root/"ui/screens/FixedLiteApp.kt").read_text()
          assert "const val TOP=20" in inst and ".take(TOP)" in inst
          assert "institutional-buys" in inst_ui and "institutional-sells" in inst_ui
          assert "LitePage.INSTITUTIONAL" in nav
          assert "refreshInstitutionalOnly()" in equity and "refreshInstitutionalAfterHours()" in equity
          assert "refreshInstitutionalResearch()" in vm
          assert "STALE_OR_MIXED_DATE" in inst and "NO_DATED_DISCLOSURES" in inst
          old_inst=subprocess.check_output(["git","show",f"{base}:app/src/main/java/com/multify/traderpro/engine/InstitutionalIntelligencePolicy.kt"]).decode()
          assert "retainedAllRows" in inst and "UNCLASSIFIED" in inst and "parseLatest" in inst
          assert "CAP_REJECTION_FUNNEL" in equity
          assert "pulseQueue.trySend" in equity and "persistFixedLivePulse" in equity
          assert "capacity=2" in equity
          master_base="7b7d2af2ca23e5269c773507ba5bd8e508908f16"
          for rel in ["service/TradingEngineService.kt","engine/WorkingRangeCandidatePolicy.kt","engine/WorkingRangeAutoBuyPolicy.kt","engine/WorkingRangeEntryMomentumPolicy.kt","engine/WorkingRangeExitPolicy.kt","data/logging/WorkingRangeRecommendationStore.kt","engine/FixedScanPerformancePolicy.kt","data/network/BetaResearchGate.kt","data/network/BetaPriorityPermitQueue.kt","data/network/GrowwHotDataCacheInterceptor.kt","engine/FixedDiscoveryWindowScheduler.kt","engine/FixedLocalStrategyEngine.kt"]:
            path=root/rel
            assert path.read_bytes()==subprocess.check_output(["git","show",f"{master_base}:{path.as_posix()}"]), "MASTER_TRADING_OR_PACING_CHANGED "+rel
          repo_current=(root/"data/repository/TradingRepository.kt").read_bytes()
          repo_base=subprocess.check_output(["git","show",f"{master_base}:app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt"])
          assert normalize_eod_backup_only(repo_current)==repo_base, "TRADING_REPOSITORY_CHANGED_OUTSIDE_PORTABLE_EOD_BACKUP"
          assert "FIXED_V741_FORECAST_SCAN_INTERVAL_MS = 90_000L" in repo
          assert "FIXED_V741_DETAILED_FORECAST_UNIVERSE_LIMIT = 48" in repo
          assert "forecastBackgroundScanningEnabled(): Boolean = false" in repo
          assert "large_cap_by_symbol" in equity and "NO_LATEST_EOD" in equity
          assert "Missing data is not zero matches" in ui
          assert low == subprocess.check_output(["git","show","a5c59d9b0c0dc43e21175cebc8df65dd48f6cd3c:app/src/main/java/com/multify/traderpro/engine/AdaptiveLowPatternPolicy.kt"]).decode()
          assert "lowCapAudit3" in ui
          archive=(root/"data/repository/NseArchiveRecoveryPolicy.kt").read_text()
          assert "REQUEST_MIN_GAP_MS=1_500L" in archive
          assert "ACCESS_DENIED_COOLDOWN_MS" in archive and "retryAfterAtMs" in archive
          assert "NSE_ARCHIVE_COOLDOWN_ACTIVE" in equity
          assert "paceArchiveRequest()" in equity and "refreshExistingOhlcAfterHours(minOf(6" in equity
          assert "archiveProgress" in ui and "archiveRetryAfterMs" in ui
          assert "appendPortableHistory(zip)" in repo and "restorePortableHistory(it)" in repo
          assert "eod_research_history.jsonl" in repo
          assert "archive_request_min_gap_ms" in equity
          old_low=subprocess.check_output(["git","show",f"{base}:app/src/main/java/com/multify/traderpro/engine/AdaptiveLowPatternPolicy.kt"]).decode()
          import re
          normalized=low.replace(", onReject:(String)->Unit = {}","").replace("        fun rejected(reason:String):AdaptiveLowCandidate? { onReject(reason); return null }\n","")
          normalized=re.sub(r'return rejected\("[A-Z_]+"\)',"return null",normalized)
          assert normalized==old_low,"Lows eligibility changed beyond telemetry"
          history=(root/"engine/InstitutionalHistoryPolicy.kt").read_text()
          assert "listOf(1,5,10,30)" in history and ".take(20)" in history
          assert "HOURLY_SWEEP_REUSED" in equity and '"groww_api_calls_added" to 0' in equity
          assert "matureInstitutionalOutcomes" in equity
          assert "hourlyHistory" in inst
          assert "grossBuy" in inst_ui and "sectorTotals" in inst_ui
          print(f"PASS: {len(locked)} frozen source files identical; -2% invariant and broker-status fail-closed")
          PY
      - name: Backend regression tests
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          python -m pytest -q backend/tests | tee backend-tests-v9051.txt
      - name: Android unit tests and assemble isolated TEST APK
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
          python - <<'PY'
          import glob,xml.etree.ElementTree as ET,pathlib
          fs=glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml")
          roots=[ET.parse(p).getroot() for p in fs]
          n=sum(int(x.attrib.get("tests",0)) for x in roots)
          errors=sum(int(x.attrib.get("failures",0))+int(x.attrib.get("errors",0)) for x in roots)
          names=[x.attrib.get("name","") for x in roots]
          essential=["HardStopLossPolicyTest","GttProtectionReadinessPolicyTest",
                     "FixedFinalContractTest","FixedBetaDetailCycleCapacityPolicyTest",
                     "BrokerOrderAcknowledgementPolicyTest",
                     "LowPeResearchPolicyTest","SwingPullbackResearchPolicyTest",
                     "LargeIndexResearchPolicyTest","LargeWatchFeaturePolicyTest",
                     "LargeWatchLearningPolicyTest","NseArchiveRecoveryPolicyTest",
                     "AdaptiveLowPatternPolicyTest","AdaptiveLowCandleEvidenceTest",
                     "AmfiMarketCapClassificationParserTest","InstitutionalIntelligencePolicyTest","InstitutionalHistoryPolicyTest","InstitutionalDisclosureCoverageTest"]
          absent=[x for x in essential if not any(x in y for y in names)]
          assert not absent, absent
          assert n>=611 and errors==0,(n,errors)
          pathlib.Path("android-tests-v9051.txt").write_text(f"{n} Android tests; {errors} failures; required suites present\n")
          print(n,"Android unit tests passed")
          PY
      - name: Inspect debug APK identity and signer
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > signer-v9051.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > package-v9051.txt
          grep -F "name='com.multify.traderpro.vivoy73final.v9051test'" package-v9051.txt >/dev/null
          python - <<'PY'
          import csv,io,json,zipfile,collections,pathlib
          asset="assets/amfi_market_cap_categories.csv"
          path=pathlib.Path("app/src/main/assets/amfi_market_cap_categories.csv")
          with zipfile.ZipFile("app/build/outputs/apk/debug/app-debug.apk") as z:
              raw=z.read(asset)
          assert raw==path.read_bytes()
          txt=raw.decode("utf-8")
          assert "#period=" in txt and "#source=https://" in txt
          rows=list(csv.DictReader(io.StringIO("\n".join(l for l in txt.splitlines() if not l.startswith("#")))))
          counts=collections.Counter(r["category"] for r in rows)
          assert len(rows)>=250 and len({r["symbol"] for r in rows})==len(rows)
          assert all(counts[k]>0 for k in ("LARGE_CAP","MID_CAP","SMALL_CAP"))
          for row in rows:
              rank=int(row["rank"])
              assert rank>0 and row["category"]==("LARGE_CAP" if rank<=100 else "MID_CAP" if rank<=250 else "SMALL_CAP")
          meta=json.loads(pathlib.Path("build/amfi-market-cap-source.txt").read_text())
          assert dict(counts)==meta["category_counts"]
          print("AMFI APK ASSET VERIFIED",meta["period"],dict(counts))
          PY
          sha256sum "$apk" > SHA256-v9051.txt
          stat -c "APK size (bytes): %s" "$apk" > size-v9051.txt
          echo "Fresh side-by-side TEST package .v9051test. Runner debug signing is ephemeral unless stable keystore is configured; future upgrades require the same persistent signing key. Never infer broker protection from unit tests." > safety-v9051.txt
      - name: Upload TEST APK and validation evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Phayra-v9.0.51-nse-archive-recovery-TEST-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            SHA256-v9051.txt
            signer-v9051.txt
            package-v9051.txt
            size-v9051.txt
            safety-v9051.txt
            android-tests-v9051.txt
            backend-tests-v9051.txt
            app/src/main/assets/amfi_market_cap_categories.csv
            build/amfi-market-cap-source.txt
          if-no-files-found: error
          retention-days: 30
