name: Multify Trader Pro v7.5.1 Embedded Fixed Intelligence Verification

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'backend/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/multify-v751-verify.yml'

permissions:
  contents: read

jobs:
  verify-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Backend tests
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          PYTHONPATH="$GITHUB_WORKSPACE" PHONE_HMAC_SECRET=test-secret-test-secret-test-secret GROWW_API_KEY=test-api-key GROWW_TOTP_SECRET=JBSWY3DPEHPK3PXP python -m pytest -q backend/tests

      - name: Verify embedded intelligence
        shell: bash
        run: |
          set -euo pipefail
          echo "8cc0cd5accc08921fd710af4ecd4f58ab1b9b5b41bc686f8713e6a7ea1267738  app/src/main/assets/embedded_historic_intelligence_v2.json.gz" | sha256sum -c -
          python - <<'PY'
          import gzip, json
          p="app/src/main/assets/embedded_historic_intelligence_v2.json.gz"
          with gzip.open(p, "rt", encoding="utf-8") as f:
              x=json.load(f)
          assert x["schemaVersion"] == 2
          assert x["fixedSnapshot"]["snapshotId"] == "FIXED-V741-2026-10-21"
          assert len(x["fixedSnapshot"]["learningCalls"]) == 108
          assert len(x["fixedSnapshot"]["longForecasts"]) == 10
          assert len(x["fixedSnapshot"]["researchSnapshots"]) == 4370
          assert len(x["fixedSnapshot"]["champions"]) == 2
          assert len(x["reports"]) == 2
          assert len(x["sourceExports"]) == 3
          print("embedded intelligence verified")
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35 packages
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Verify Fixed and Forecast separation
        shell: bash
        run: |
          set -euo pipefail
          grep -R 'Fixed("Fixed"' app/src/main/java/com/multify/traderpro/ui/screens/TraderApp.kt
          grep -R 'Auto-buy forecast recommendations' app/src/main/java/com/multify/traderpro/ui/screens/TraderApp.kt
          grep -R 'Auto-buy Fixed recommendations' app/src/main/java/com/multify/traderpro/ui/screens/TraderApp.kt
          grep -R 'restoreExactIfAbsent(embedded.fixedSnapshot)' app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt
          grep -R 'ensureEmbeddedHistoricalIntelligence()' app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt
          grep -R 'managedDao.openPosition(ENGINE_FORECAST_HOLDING' app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt
          grep -R 'managedDao.openPosition(ENGINE_FIXED_HOLDING' app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt
          grep -R 'triggerDirection = ForecastAutoBuyPolicy.TRIGGER_DIRECTION' app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt
          ! grep -R 'MAX_DAILY_RECOMMENDATIONS' app/src/main/java
          ! grep -R 'publishable.take' app/src/main/java

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify package and signature
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Multify-TraderPro-v7.5.1-fixed-embedded-history-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/Multify-TraderPro-v7.5.1-fixed-embedded-history-debug.apk > dist/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/Multify-TraderPro-v7.5.1-fixed-embedded-history-debug.apk | grep -E "^(package:|application-label:)" > dist/package-verification.txt
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          git archive --format=zip --output=dist/Multify-TraderPro-v7.5.1-source.zip HEAD

      - uses: actions/upload-artifact@v4
        with:
          name: Multify-TraderPro-v7.5.1-verified
          path: dist/
          if-no-files-found: error
