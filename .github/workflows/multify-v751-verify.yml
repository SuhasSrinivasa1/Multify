name: Multify Trader Pro v7.6.7 Direct Auto Buy Verification

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'backend/**'
      - '.github/workflows/multify-v751-verify.yml'

permissions:
  contents: write

jobs:
  verify-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Backend tests
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          PYTHONPATH="$GITHUB_WORKSPACE" PHONE_HMAC_SECRET=test-secret-test-secret-test-secret GROWW_API_KEY=test-api-key GROWW_TOTP_SECRET=JBSWY3DPEHPK3PXP python -m pytest -q backend/tests

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35 packages
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Verify final Fixed architecture and source lock
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/assets/embedded_historic_intelligence_v2.json.gz
          grep -R 'class EmbeddedHistoricalIntelligenceStore' app/src/main/java
          grep -R 'ASSET_CANDIDATES' app/src/main/java/com/multify/traderpro/data/repository/EmbeddedHistoricalIntelligenceStore.kt
          grep -R 'Embedded Multify intelligence checksum mismatch' app/src/main/java/com/multify/traderpro/data/repository/EmbeddedHistoricalIntelligenceStore.kt
          grep -R 'FIXED-V741-20261021-190239-FINAL' app/src/main/java
          grep -R 'd807204a6d5d71a69f45ef4d21d7ef63063b85b56d401a6795e8f265a9f393fe' app/src/main/java
          grep -R 'CANONICAL_LEARNING_CALLS = 107' app/src/main/java
          grep -R 'CANONICAL_MULTIFY_MFE_AVG_PCT = 1.1161043030113955' app/src/main/java
          grep -R 'Fixed Avg Upside · FROZEN' app/src/main/java/com/multify/traderpro/ui/screens/TraderApp.kt
          grep -R 'Frozen Multify calibration calls' app/src/main/java/com/multify/traderpro/ui/screens/TraderApp.kt
          grep -R 'fixedSnapshotDto(fixedSnapshotState)' app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt
          grep -R 'price_gate_stage" to "PUBLICATION_ONLY"' app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt
          grep -R 'if (evaluation.features.ltp < 10.0) continue' app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt
          grep -R 'features.ltp <= FIXED_MIN_STOCK_PRICE_RUPEES' app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt
          grep -R 'LocalTime.of(9, 15)' app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt
          grep -R 'LocalTime.of(15, 30)' app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt
          grep -R 'sizeFixedAvailable' app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt
          grep -R 'sizeStrictBudget' app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt
          grep -R 'ARM_TRIGGER_PCT = 0.55' app/src/main/java/com/multify/traderpro/engine/SteppedTrailingPolicy.kt
          grep -R 'INITIAL_STOP_GAIN_PCT = 0.50' app/src/main/java/com/multify/traderpro/engine/SteppedTrailingPolicy.kt
          grep -R 'STEP_PCT = 0.10' app/src/main/java/com/multify/traderpro/engine/SteppedTrailingPolicy.kt
          grep -R 'HIGH_END_CONCURRENCY = 4' app/src/main/java/com/multify/traderpro/engine/FixedScanPerformancePolicy.kt
          grep -R 'HIGH_END_MIN_PROCESSORS = 8' app/src/main/java/com/multify/traderpro/engine/FixedScanPerformancePolicy.kt
          grep -R 'FixedScanPerformancePolicy.evaluationConcurrency(availableProcessors)' app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt
          grep -R 'universe.chunked(fixedEvaluationConcurrency)' app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt
          ! grep -R 'MAX_DAILY_RECOMMENDATIONS' app/src/main/java

          python - <<'PY'
          from pathlib import Path
          import subprocess

          manifest = Path("FIXED_FINAL_LOCK.gitsha").read_text().splitlines()
          for line in manifest:
              line = line.strip()
              if not line or line.startswith("#") or line.startswith("REGION "):
                  continue
              expected, path = line.split(None, 1)
              actual = subprocess.check_output(["git", "hash-object", path], text=True).strip()
              assert actual == expected, f"Final Fixed lock changed: {path}: {actual} != {expected}"

          repo = Path("app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt").read_text()
          begin = repo.index("    // FIXED_FINAL_LOCK_BEGIN:")
          end_marker = "    // FIXED_FINAL_LOCK_END: FIXED-V741-20261021-190239-FINAL"
          end = repo.index(end_marker, begin) + len(end_marker)
          if end < len(repo) and repo[end:end+1] == "\n":
              end += 1
          region = repo[begin:end]
          actual_region = subprocess.check_output(["git", "hash-object", "--stdin"], input=region, text=True).strip()
          expected_region = next(x.split()[1] for x in manifest if x.startswith("REGION "))
          assert actual_region == expected_region, f"Final Fixed coordinator region changed: {actual_region} != {expected_region}"

          pairs = [
              ("LocalStrategyEngine.kt", "FixedLocalStrategyEngine.kt"),
              ("ForecastQualityPolicy.kt", "FixedForecastQualityPolicy.kt"),
              ("MultifyFactorFamilies.kt", "FixedMultifyFactorFamilies.kt"),
              ("ForecastPublicationPolicy.kt", "FixedForecastPublicationPolicy.kt"),
              ("MarketDiscoveryPolicy.kt", "FixedMarketDiscoveryPolicy.kt"),
              ("PositiveCloseForecastPolicy.kt", "FixedPositiveCloseForecastPolicy.kt"),
              ("MultifyReverseEngineering.kt", "FixedMultifyReverseEngineering.kt"),
          ]
          root = "app/src/main/java/com/multify/traderpro/engine/"
          ref = "ca0eecaf63d2cc3500e11fd73f8de9bf2d87e39f"
          for original, fixed in pairs:
              old = subprocess.check_output(["git", "show", f"{ref}:{root}{original}"], text=True)
              frozen = Path(root + fixed).read_text()
              normalize = lambda s: s.replace("Fixed", "").replace("fixed", "")
              assert normalize(old) == normalize(frozen), f"{fixed} drifted from exact v7.4.1 implementation"
          PY

      - name: Verify continuous holding monitor wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'android.permission.WAKE_LOCK' app/src/main/AndroidManifest.xml
          grep -q 'POSITION_WAKE_LOCK_ACQUIRED' app/src/main/java/com/multify/traderpro/service/TradingEngineService.kt
          grep -q 'POSITION_MONITOR_ERROR_RETRY_MS = 1_000L' app/src/main/java/com/multify/traderpro/service/TradingEngineService.kt
          grep -q 'PORTFOLIO_POSITION_LOOP_INTERVAL_MS = 1_000L' app/src/main/java/com/multify/traderpro/service/TradingEngineService.kt
          grep -q 'const val ENGINE_PORTFOLIO_HOLDING = "PORTFOLIO_HOLDING"' app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt
          grep -q 'EXISTING_HOLDING_IMPORTED' app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt
          grep -q 'ACTIVE_GTT_DISCOVERY_ERROR' app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt
          grep -q 'PORTFOLIO_REIMPORT_COOLDOWN_MS = 120_000L' app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt
          grep -q 'private fun startPositionMonitorWorker()' app/src/main/java/com/multify/traderpro/service/TradingEngineService.kt
          grep -q 'private fun startFixedScanWorker()' app/src/main/java/com/multify/traderpro/service/TradingEngineService.kt
          grep -q 'private fun startForecastScanWorker()' app/src/main/java/com/multify/traderpro/service/TradingEngineService.kt
          grep -q '"fixed_not_blocked_by_forecast" to true' app/src/main/java/com/multify/traderpro/service/TradingEngineService.kt
          grep -q '"forecast_blocking_ms" to 0' app/src/main/java/com/multify/traderpro/service/TradingEngineService.kt
          grep -q 'SCAN_WORKER_POLL_MS = 1_000L' app/src/main/java/com/multify/traderpro/service/TradingEngineService.kt
          grep -q 'FORECAST_SCAN_PAUSED_FOR_FIXED_PRIORITY' app/src/main/java/com/multify/traderpro/service/TradingEngineService.kt
          grep -q 'forecastScannerEnabled: Boolean = false' app/src/main/java/com/multify/traderpro/data/preferences/AppPreferences.kt
          grep -q 'BULK_MARKET_DATA_429_COOLDOWN_MS = 1_500L' app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt
          grep -q 'generateFixedForecasts(force = false)' app/src/main/java/com/multify/traderpro/ui/screens/TraderViewModel.kt
          grep -q 'prepareFixedPreMarketWarmup' app/src/main/java/com/multify/traderpro/service/TradingEngineService.kt
          grep -q 'LocalTime.of(9, 0)' app/src/main/java/com/multify/traderpro/service/TradingEngineService.kt
          grep -q '"market_data_scanned" to false' app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt
          grep -q 'OVERNIGHT_TRAIL_PRESERVED' app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt
          grep -q 'RESTORE_PERSISTENT_TRAILING_FROM_LEGACY_RECOVERY' app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt
          grep -q 'BULK_MARKET_DATA_MIN_GAP_MS = 210L' app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt
          grep -q 'APP_LIVE_DATA_PER_MINUTE = 285' app/src/main/java/com/multify/traderpro/engine/GrowwApiBudgetPolicy.kt
          grep -q 'APP_LIVE_DATA_PER_SECOND = 9' app/src/main/java/com/multify/traderpro/engine/GrowwApiBudgetPolicy.kt
          grep -q 'SELL_MONITOR_RESERVED_PER_MINUTE = 60' app/src/main/java/com/multify/traderpro/engine/GrowwApiBudgetPolicy.kt
          grep -q 'withFixedLiveDataSlot' app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt
          grep -q 'withFixedHistoricalDataSlot' app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt
          grep -q 'forecast_auto_buy_forced_off_when_paused' app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt
          grep -q 'suspend fun refreshDashboardLocal()' app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt
          grep -q 'Fixed outcome tracking is diagnostic only' app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt
          grep -q 'todayAveragePct = todayAverage' app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt
          grep -q 'repository.refreshDashboardLocal()' app/src/main/java/com/multify/traderpro/ui/screens/TraderViewModel.kt
          grep -q 'label = "Multify 30-day Avg"' app/src/main/java/com/multify/traderpro/ui/screens/TraderApp.kt
          grep -q 'label = "Multify Today Avg"' app/src/main/java/com/multify/traderpro/ui/screens/TraderApp.kt
          grep -q 'label = "Fixed Daily Avg"' app/src/main/java/com/multify/traderpro/ui/screens/TraderApp.kt
          ! grep -q 'Market-hours priority' app/src/main/java/com/multify/traderpro/ui/screens/TraderApp.kt
          grep -q 'FIXED_V741_FORECAST_SCAN_INTERVAL_MS = 150_000L' app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt
          grep -q 'ENTRY_MARKET_FILLED' app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt
          grep -q 'entryPrice = actualFill' app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt
          grep -q 'FIXED_DIRECT_AUTO_BUY_ORDER_PACING_MS = 175L' app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt
          ! grep -q 'New Fixed PRIMARY recommendations create independent GTT UP entry orders' app/src/main/java/com/multify/traderpro/ui/screens/TraderApp.kt
          grep -q 'Every new Fixed PRIMARY recommendation is sent as its own direct CNC MARKET BUY' app/src/main/java/com/multify/traderpro/ui/screens/TraderApp.kt
          grep -q 'android:largeHeap="true"' app/src/main/AndroidManifest.xml
          grep -q 'versionCode = 767' app/build.gradle.kts
          grep -q 'versionName = "7.6.7-direct-auto-buy"' app/build.gradle.kts

      - name: Restore stable app signing key when configured
        shell: bash
        env:
          MULTIFY_KEYSTORE_BASE64: ${{ secrets.MULTIFY_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$MULTIFY_KEYSTORE_BASE64" ]; then
            printf '%s' "$MULTIFY_KEYSTORE_BASE64" | base64 --decode > app/multify-v4-stable.jks
            chmod 600 app/multify-v4-stable.jks
            echo "Stable app signing key restored."
          else
            echo "Stable signing secret is not configured; this APK will use runner debug signing and may require uninstalling a differently signed existing build."
          fi

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
        env:
          MULTIFY_KEYSTORE_PASSWORD: ${{ secrets.MULTIFY_KEYSTORE_PASSWORD }}

      - name: Verify package and signature
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Multify-TraderPro-v7.6.7-direct-auto-buy-debug.apk
          python - <<'PY'
          import gzip, hashlib, zipfile
          apk = "dist/Multify-TraderPro-v7.6.7-direct-auto-buy-debug.apk"
          expected_json = "c5d23a7d14ef413c25f63d43672d8729c77469c589e1c4e36dd2f209ec7f304b"
          expected_gzip = "8cc0cd5accc08921fd710af4ecd4f58ab1b9b5b41bc686f8713e6a7ea1267738"
          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())
              if "assets/embedded_historic_intelligence_v2.json" in names:
                  payload = z.read("assets/embedded_historic_intelligence_v2.json")
                  assert hashlib.sha256(payload).hexdigest() == expected_json, "Packaged JSON asset hash mismatch"
              elif "assets/embedded_historic_intelligence_v2.json.gz" in names:
                  packed = z.read("assets/embedded_historic_intelligence_v2.json.gz")
                  assert hashlib.sha256(packed).hexdigest() == expected_gzip, "Packaged gzip asset hash mismatch"
                  payload = gzip.decompress(packed)
                  assert hashlib.sha256(payload).hexdigest() == expected_json, "Inflated JSON asset hash mismatch"
              else:
                  raise AssertionError("Embedded historic intelligence asset missing from APK")
              assert payload.startswith(b'{"schemaVersion":2'), "Embedded historic intelligence JSON is malformed"
          print("Embedded historic intelligence APK asset: checksum verified")
          PY
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/Multify-TraderPro-v7.6.7-direct-auto-buy-debug.apk > dist/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/Multify-TraderPro-v7.6.7-direct-auto-buy-debug.apk | grep -E "^(package:|application-label:)" > dist/package-verification.txt
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          git archive --format=zip --output=dist/Multify-TraderPro-v7.6.7-source.zip HEAD

      - uses: actions/upload-artifact@v4
        with:
          name: Multify-TraderPro-v7.6.7-direct-auto-buy-verified
          path: dist/
          if-no-files-found: error

      - name: Publish verified APK release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v7.6.7-direct-auto-buy"
          TITLE="Multify Trader Pro v7.6.7 Direct Auto Buy"
          ASSETS=(
            "dist/Multify-TraderPro-v7.6.7-direct-auto-buy-debug.apk"
            "dist/Multify-TraderPro-v7.6.7-source.zip"
            "dist/SHA256SUMS.txt"
            "dist/signature.txt"
            "dist/package-verification.txt"
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TITLE" \
              --notes "Verified APK with unchanged frozen Fixed recommendation logic, 2.5-minute Fixed scan gate, direct Fixed CNC market auto-buy, actual-fill target/trailing anchoring, legacy Fixed entry-GTT reconciliation, larger Android heap headroom, existing API-budget governors, and unchanged portfolio-wide persistent trailing sell protection." \
              "${ASSETS[@]}"
          fi
