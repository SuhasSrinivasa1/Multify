name: Multify v8.3.24 Adaptive Timeframe Shadow
on:
  push:
    branches: [v8324-adaptive-timeframe-evidence-shadow]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Verify changed files and production source parity
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          base = "a6752e82a8573db4a050334bf8956fde0c7348e0"
          allowed = {
            "app/build.gradle.kts",
            "app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt",
            "app/src/main/java/com/multify/traderpro/engine/FixedTimeframeShadowDecisionPolicy.kt",
            "app/src/test/java/com/multify/traderpro/engine/FixedTimeframeShadowDecisionPolicyTest.kt",
            "docs/ADAPTIVE_TIMEFRAME_SHADOW_V8324.md",
            ".github/workflows/multify-v8324-adaptive-timeframe-shadow.yml",
          }
          changed = set(subprocess.check_output(
              ["git","diff","--name-only",base,"HEAD"], text=True).splitlines())
          assert changed <= allowed, "Unexpected production change: " + str(changed - allowed)
          root = "app/src/main/java/com/multify/traderpro/"
          source = Path(root+"data/repository/TradingRepository.kt").read_text()
          original = subprocess.check_output(
              ["git","show",base+":"+root+"data/repository/TradingRepository.kt"], text=True)
          # Only one read-only audit insertion in the already optional 5m shadow.
          marker = "            // V8324_SHADOW_DIAGNOSTICS_BEGIN"
          endmarker = "            // V8324_SHADOW_DIAGNOSTICS_END\n"
          assert source.count(marker) == 1 and source.count(endmarker) == 1
          before, rest = source.split(marker,1)
          _, after = rest.split(endmarker,1)
          assert before+after == original, "TradingRepository production or research drift"
          for path in [
              "engine/FixedLocalStrategyEngine.kt",
              "engine/FixedFinalContract.kt",
              "engine/FixedForecastPublicationPolicy.kt",
              "engine/SteppedTrailingPolicy.kt",
              "engine/HardStopLossPolicy.kt",
              "data/network/GrowwApi.kt"
          ]:
              p = root+path
              assert Path(p).read_bytes() == subprocess.check_output(
                  ["git","show",base+":"+p]), p
          assert 'versionCode = 8405' in Path('app/build.gradle.kts').read_text()
          assert 'versionName = "8.3.24-adaptive-timeframe-shadow"' in Path('app/build.gradle.kts').read_text()
          print("PASS: production code unchanged; 5m diagnostics isolated")
          PY
      - name: Android unit tests and APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Upload experimental debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Multify-v8324-Adaptive-Timeframe-Shadow-TEST-debug
          path: app/build/outputs/apk/debug/*.apk
