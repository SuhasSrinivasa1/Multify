name: Bootstrap Multify source and build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-multify.yml'

permissions:
  contents: write

jobs:
  bootstrap-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source.b64.part.* | base64 --decode > /tmp/multify-source.zip
          rm -rf /tmp/multify-src
          mkdir -p /tmp/multify-src
          unzip -q /tmp/multify-source.zip -d /tmp/multify-src
          test -f /tmp/multify-src/v450/settings.gradle.kts

      - name: Expand source into repository
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete-after \
            --exclude '.git/' \
            --exclude '.bootstrap/' \
            --exclude '.github/workflows/bootstrap-multify.yml' \
            --exclude '.pytest_cache/' \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            /tmp/multify-src/v450/ ./
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-multify.yml
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          rm -rf .pytest_cache

      - name: Verify no private signing material or dotenv files
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name '*.jks' -o -name '*.keystore' -o -name '*.p12' -o -name '*.pem' -o -name '*.key' -o -name '.env' \) | grep -q .; then
            echo 'Private signing material or .env file found; refusing to commit.'
            exit 1
          fi

      - name: Backend tests
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          PYTHONPATH="$GITHUB_WORKSPACE" \
          PHONE_HMAC_SECRET=test-secret-test-secret-test-secret \
          GROWW_API_KEY=test-api-key \
          GROWW_TOTP_SECRET=JBSWY3DPEHPK3PXP \
          python -m pytest -q backend/tests

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35 packages
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build installable debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload bootstrap APK
        uses: actions/upload-artifact@v4
        with:
          name: Multify-v4.5.0-bootstrap-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Commit complete source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Multify Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Import Multify Trader Pro v4.5.0 source"
            git push origin HEAD:main
          fi
