name: Multify 9.0 MASTER fixed parity and versioned shadow
on:
  push:
    branches: [v9-master-validation-shadow-20261113]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-replay-android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Verify 7.4.1 golden baseline, v19 frozen LIVE and exact v16 research copy
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          ref19=["30d3ab4f474fc1ed4103da5e1247b0078f484eaf",
                 "af87c4126572c6aca9a8fadea940011a13bf0ab8"]
          ref16="1e167cf64b4931c0c4eb9cdfd5756c1bc252c450"
          base28="309b50c297964bf313b26c651a1287e1795e5807"
          root="app/src/main/java/com/multify/traderpro/"
          repo=root+"data/repository/TradingRepository.kt"
          service=root+"service/TradingEngineService.kt"
          def old(ref,path):
              return subprocess.check_output(["git","show",f"{ref}:{path}"],text=True)
          def part(s,a,b):
              i=s.index(a)
              return s[i:s.index(b,i)]
          current=Path(repo).read_text()
          for v in ref19:
              prev=old(v,repo)
              for a,b in [
                ("suspend fun generateFixedForecasts(","private fun fixedSnapshotMultifyMfeAverage("),
                ("private suspend fun discoverFixedMarketWideCandidates(","private suspend fun fetchFixedDiscoveryLtpBatch(")]:
                  assert part(current,a,b)==part(prev,a,b), (v,a,"Fixed changed!")
              for rel in (
                "engine/FixedFinalContract.kt",
                "engine/FixedMarketDiscoveryPolicy.kt",
                "engine/FixedForecastPublicationPolicy.kt",
                "engine/FixedForecastQualityPolicy.kt",
                "engine/FixedLocalStrategyEngine.kt",
                "engine/FixedFastCandidateSelectionPolicy.kt",
                "engine/FixedEntryActionabilityPolicy.kt",
                "engine/RecommendationPriceBandPolicy.kt",
                "engine/FixedMultifyFactorFamilies.kt"):
                  file=root+rel
                  assert Path(file).read_bytes()==subprocess.check_output(["git","show",f"{v}:{file}"]), (v,file)
          for original,clone,orig_label,new_label in [
             ("FixedLocalStrategyEngine.kt","V9Fixed8316StrategyShadow.kt",
               "object FixedLocalStrategyEngine","internal object V9Fixed8316StrategyShadow"),
             ("FixedForecastQualityPolicy.kt","V9Fixed8316QualityShadow.kt",
               "object FixedForecastQualityPolicy","internal object V9Fixed8316QualityShadow")
          ]:
              prev=old(ref16,root+"engine/"+original)
              cloned=Path(root+"engine/"+clone).read_text()
              assert prev[prev.index(orig_label):].replace(orig_label,new_label,1)==cloned[cloned.index(new_label):], clone
          assert "v9MasterShadowCollector.offer(" in current
          assert "v9MasterShadowCollector.offer(" not in part(
              current,"suspend fun generateFixedForecasts(","private fun fixedSnapshotMultifyMfeAverage(")
          assert Path(service).read_bytes()==subprocess.check_output(["git","show",f"{base28}:{service}"])
          # Broker transport already had endpoint 1s/60s tracing; preserve it
          # BYTE-IDENTICALLY rather than reimplementing duplicate counters.
          for p in ("data/network/GrowwRateLimitInterceptor.kt",
                    "data/network/BetaHttpTraceInterceptor.kt",
                    "data/network/GrowwHttpTraceLedger.kt"):
              f=root+p
              assert Path(f).read_bytes()==subprocess.check_output(["git","show",f"{base28}:{f}"]), f
          assert not Path(root+"engine/V9EndpointPressureWindow.kt").exists()
          for rel in ("engine/HardStopLossPolicy.kt","engine/ReleaseIntegrityManifest.kt",
                      "engine/SteppedTrailingPolicy.kt","engine/NetGainTrailingPolicy.kt",
                      "engine/FixedSingleWorkerStartGate.kt","engine/HardStopGttTighteningPolicy.kt"):
              file=root+rel
              assert Path(file).read_bytes()==subprocess.check_output(["git","show",f"{base28}:{file}"]), file
          assert "const val MAX_LOSS_PCT = 2.0" in Path(root+"engine/HardStopLossPolicy.kt").read_text()
          assert "const val HARD_STOP_LOSS_PCT = 2.0" in Path(root+"engine/ReleaseIntegrityManifest.kt").read_text()
          assert "const val CANONICAL_LEARNING_CALLS = 107" in Path(root+"engine/FixedFinalContract.kt").read_text()
          assert "versionCode = 9000" in Path("app/build.gradle.kts").read_text()
          assert 'versionName = "9.0.0-master-strategy-validation"' in Path("app/build.gradle.kts").read_text()
          changed=set(subprocess.check_output(["git","diff","--name-only",base28,"HEAD"],text=True).splitlines())
          allowed={
              repo,"app/build.gradle.kts",
              root+"engine/V9Fixed8316StrategyShadow.kt",
              root+"engine/V9Fixed8316QualityShadow.kt",
              root+"engine/V9MasterShadowCollector.kt",
              "app/src/test/java/com/multify/traderpro/engine/V9VersionedShadowReplayTest.kt",
              "backend/app/v9_master_log_replay.py",
              "backend/tests/test_v9_master_log_replay.py",
              "docs/V9_MASTER_VALIDATION.md",
              "docs/V9_MASTER_100_QUESTION_VALIDATION.md",
              ".github/workflows/multify-v9-master.yml"}
          assert changed<=allowed, ("UNAUTHORIZED_LIVE_EDIT",changed-allowed)
          print("PASS 7.4.1 reference, v19 LIVE parity, exact v16 shadow, -2% GTT safety, scope")
          PY
      - name: Matched historical replay plus cumulative ZIP test
        run: |
          python -m unittest discover -s backend/tests -p 'test_adaptive_timeframe_replay.py' -v
          python -m unittest discover -s backend/tests -p 'test_v9_master_log_replay.py' -v
      - name: Full Android unit tests and v9 Master TEST APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Upload signed-by-CI TEST artifact
        uses: actions/upload-artifact@v4
        with:
          name: Multify-v9.0.0-Master-Validation-TEST-debug
          path: app/build/outputs/apk/debug/*.apk
