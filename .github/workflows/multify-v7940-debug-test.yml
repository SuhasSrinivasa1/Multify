name: Multify v7.9.40 Protected Multify Parallel Buys and Upward GTT Trail TEST APK
on:
  push:
    branches: [v7940-protected-parallel-buys-trail]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Source-scope safety gates
        run: |
          set -euo pipefail
          git fetch --no-tags origin v7938-forecast-news-fixed-shadow-audit
          python - <<'PY'
          from pathlib import Path
          import subprocess
          base="origin/v7938-forecast-news-fixed-shadow-audit"
          root=Path("app/src/main/java/com/multify/traderpro")
          protected=[
            "engine/FixedLocalStrategyEngine.kt","engine/FixedForecastQualityPolicy.kt",
            "engine/FixedForecastPublicationPolicy.kt","engine/FixedMultifyFactorFamilies.kt",
            "engine/FixedMarketDiscoveryPolicy.kt","engine/HardStopLossPolicy.kt",
            "data/network/GrowwApiFactory.kt",
            "data/network/BetaReadOnlyInterceptor.kt","engine/ForecastEarlyEntryPolicy.kt",
            "engine/ForecastPublicationPolicy.kt","engine/LocalStrategyEngine.kt",
            "engine/ForecastQualityPolicy.kt"
          ]
          for name in protected:
              path="app/src/main/java/com/multify/traderpro/"+name
              prev=subprocess.check_output(["git","show",f"{base}:{path}"]).decode()
              assert Path(path).read_text()==prev, "PROTECTED SOURCE CHANGED: "+name
          s=(root/"data/repository/TradingRepository.kt").read_text()
          before=subprocess.check_output(["git","show",f"{base}:app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt"]).decode()
          # Core score and decision-region still identical except the explicit publication price gate and
          # rejection of out-of-band historical requests. Shadow code is outside the locked region.
          def locked(source):
              return source.split("// FIXED_FINAL_LOCK_BEGIN",1)[1].split("// FIXED_FINAL_LOCK_END",1)[0]
          assert locked(s)==locked(before), "FIXED FROZEN PRODUCTION BLOCK CHANGED"
          assert locked(s).count('candleInterval = "15minute"')==2
          assert 'FixedLocalStrategyEngine.buildFeatures(quote, historical, 15)' in locked(s)
          assert 'FixedLocalStrategyEngine.buildFeatures(quote, historical, 5)' not in locked(s)
          assert 'fixedFiveMinuteShadowJournal' in s
          assert '"fixed_5m_shadow_comparison_summary.json"' in s
          assert '"comparison_group" to pair.comparisonGroup' in s
          assert 'ForecastExpectedAverageGainPolicy.estimate(' in s
          assert 'item.expectedGain.eligible' in s
          assert 'ForecastNotificationFreshnessPolicy.fresh(row.generatedAtMs' in s
          assert 'NEWS_PROVISIONAL_WATCH' in s
          assert 'existingByKey[key] = merged' in s
          assert 'forecastMarketCapacityAvailable()' in s
          assert 'item.economics.profitableAfterCosts' not in s.split('val publishable = unseen.filter',1)[1].split('publishable.forEach',1)[0]
          assert '"fixed_5m_shadow_pairs.json"' in s
          assert 'daily_recommendation_cap" to "NONE"' in s
          assert "RecommendationPriceBandPolicy.eligible(ltp)" in s
          policy=(root/"engine/RecommendationPriceBandPolicy.kt").read_text()
          assert 'MIN_EXCLUSIVE_RUPEES = 200.0' in policy
          assert 'MAX_EXCLUSIVE_RUPEES = 5_000.0' in policy
          assert 'price > MIN_EXCLUSIVE_RUPEES && price < MAX_EXCLUSIVE_RUPEES' in policy
          assert 'sampleFixedFiveMinuteShadow(fixedShadowOrdinal)' in (root/"service/TradingEngineService.kt").read_text()
          assert 'FixedShadowSamplingPolicy.shouldSample' not in (root/"service/TradingEngineService.kt").read_text()
          sh=s.split('suspend fun sampleFixedFiveMinuteShadow(',1)[1].split('suspend fun updateFixedFiveMinuteShadowOutcomes()',1)[0]
          assert 'apiFactory.groww.historicalCandles(' in sh
          assert 'candleInterval = "5minute"' in sh
          assert 'apiFactory.betaGroww' not in sh
          assert 'apiFactory.groww.quote(' not in sh
          assert 'orders_allowed" to false' in sh
          assert 'fixedShadowReferences[symbol]' in s
          assert 'FixedQuoteTelemetryPolicy.capture(rawQuote)' in (root/"data/logging/FixedFactorTelemetry.kt").read_text()
          assert 'MIN_INTERVAL_MS = 12L * 60L * 1000L' in (root/"engine/FixedShadowSamplingPolicy.kt").read_text()
          assert 'candle_interval_minutes" to 15' in (root/"data/logging/FixedFactorTelemetry.kt").read_text()
          assert 'ForecastNewsPublicationGate.mayPublish(ltp, qualifies, alreadyRecommended)' in s
          assert '"OUTSIDE_200_5000_EXCLUSIVE_PRICE_BAND"' in s
          assert 'latestBrokerCooldownUntilMs = latestCooldownUntilMs' in s
          assert 'ExecutionQuoteLiquidityPolicy.rejectionReason(quote)' in s
          assert 'POST_429_RESEARCH_QUIET_PERIOD_MS = 30L * 60L * 1000L' in (root/"engine/FixedShadowSamplingPolicy.kt").read_text()
          assert '"quote_book_status"' in (root/"data/logging/FixedQuoteTelemetryPolicy.kt").read_text()
          assert 'versionCode = 7940' in Path("app/build.gradle.kts").read_text()
          changed=set(subprocess.check_output(["git","diff","--name-only",f"{base}...HEAD"]).decode().splitlines())
          allowed={
            "app/build.gradle.kts",
            "app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt",
            "app/src/main/java/com/multify/traderpro/service/MultifyNotificationListenerService.kt",
            "app/src/main/java/com/multify/traderpro/engine/SteppedTrailingPolicy.kt",
            "app/src/main/java/com/multify/traderpro/engine/ReleaseIntegrityManifest.kt",
            "app/src/main/java/com/multify/traderpro/engine/GttProtectionReadinessPolicy.kt",
            "app/src/test/java/com/multify/traderpro/engine/SteppedTrailingPolicyTest.kt",
            "app/src/test/java/com/multify/traderpro/engine/GttProtectionReadinessPolicyTest.kt",
            ".github/workflows/multify-v7940-debug-test.yml",
            ".github/workflows/multify-v7940-stable.yml"
          }
          assert changed <= allowed,"Unexpected changed files: "+str(changed-allowed)
          trailing=(root/"engine/SteppedTrailingPolicy.kt").read_text()
          assert 'SECOND_TRIGGER_PCT = 0.75' in trailing
          assert '(gain - SECOND_TRIGGER_PCT)' in trailing
          assert 'ARM_TRIGGER_PCT = 0.55' in trailing
          assert 'INITIAL_STOP_GAIN_PCT = 0.50' in trailing
          assert 'STEP_PCT = 0.10' in trailing
          assert 'registerBoughtPositionAndProtect(' in s
          assert 'UNPROTECTED_CONFIRMED_BUY_CRITICAL' in s
          assert 'NEW_BUY_BLOCKED_UNPROTECTED_HOLDING' in s
          assert 'protectiveGttCreationMutex.withLock' in s
          assert 'multifyBuyLifecycleMutex.withLock' in s
          assert 'marketCriticalTradeCount.incrementAndGet()' in s
          assert 'marketCriticalTradeCount.decrementAndGet()' in s
          listener=(root/"service/MultifyNotificationListenerService.kt").read_text()
          assert 'Dispatchers.IO.limitedParallelism(4)' in listener
          assert 'GttProtectionReadinessPolicy.verified(' in s
          assert 'SteppedTrailingPolicy.SECOND_TRIGGER_PCT == TRAIL_SECOND_TRIGGER_PCT' in (root/"engine/ReleaseIntegrityManifest.kt").read_text()
          print("Fixed scoring locked 15m; common upward trailing changed by request; 5m research only; BUY must have protection; Forecast uncapped")
          PY
      - name: Backend tests
        run: |
          python -m pip install -r backend/requirements.txt
          PYTHONPATH="$GITHUB_WORKSPACE" PHONE_HMAC_SECRET=test-secret-test-secret-test-secret GROWW_API_KEY=test-api-key GROWW_TOTP_SECRET=JBSWY3DPEHPK3PXP python -m pytest -q backend/tests
      - name: Android unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build TEST APK (not installation-compatible by assumption)
        run: gradle --no-daemon assembleDebug
      - name: Verify APK and create checksum
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Multify-TraderPro-v7.9.40-TEST-only-ephemeral-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/*.apk > dist/APK-SIGNATURE.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/*.apk | head -n 2 > dist/PACKAGE.txt
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          git rev-parse HEAD > dist/SOURCE-COMMIT.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multify-v7940-test-only-ephemeral-debug
          path: dist/
          if-no-files-found: warn
