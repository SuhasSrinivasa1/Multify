name: Multify v8.3.25 Fixed Selection-Parity and Speed Guard
on:
  push:
    branches: [v8325-fixed-v8319-selection-parity-speed-guard]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-parity-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Verify selection and filter source matches v8.3.19 variants
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          v19 = "30d3ab4f474fc1ed4103da5e1247b0078f484eaf"
          alt19 = "af87c4126572c6aca9a8fadea940011a13bf0ab8"
          v24 = "04ba735befec32e7d62c8269cd3416dd4b5b833f"
          root = "app/src/main/java/com/multify/traderpro/"
          key = root + "data/repository/TradingRepository.kt"
          def contents(ref,path):
              return subprocess.check_output(["git","show",f"{ref}:{path}"], text=True)
          def section(txt,start,end):
              a=txt.index(start)
              return txt[a:txt.index(end,a)]
          current=Path(key).read_text()
          for old in [v19,alt19]:
              original=contents(old,key)
              for start,end in [
                  ("suspend fun generateFixedForecasts(", "private fun fixedSnapshotMultifyMfeAverage("),
                  ("private suspend fun discoverFixedMarketWideCandidates(", "private suspend fun fetchFixedDiscoveryLtpBatch("),
              ]:
                  assert section(current,start,end) == section(original,start,end), f"Fixed selection drift vs {old}: {start}"
              for immutable in [
                  "engine/FixedFinalContract.kt",
                  "engine/FixedMarketDiscoveryPolicy.kt",
                  "engine/FixedForecastPublicationPolicy.kt",
                  "engine/FixedForecastQualityPolicy.kt",
                  "engine/FixedLocalStrategyEngine.kt",
                  "engine/FixedFastCandidateSelectionPolicy.kt",
                  "engine/FixedEntryActionabilityPolicy.kt",
                  "engine/RecommendationPriceBandPolicy.kt",
                  "engine/FixedMultifyFactorFamilies.kt",
              ]:
                  p=root+immutable
                  assert Path(p).read_bytes()==subprocess.check_output(["git","show",f"{old}:{p}"]), f"Fixed policy drift: {p}"
          assert "val universe = (discoveredSymbols + dnaSymbols + recentSymbols + rotating)" in current
          assert "val universe = (carriedPrimarySymbols" not in current
          assert "currentLtps = current," in section(current,"private suspend fun discoverFixedMarketWideCandidates(","private suspend fun fetchFixedDiscoveryLtpBatch(")
          assert "val priceEligibleForDetail" not in section(current,"private suspend fun discoverFixedMarketWideCandidates(","private suspend fun fetchFixedDiscoveryLtpBatch(")
          assert "FIXED_V741_FORECAST_SCAN_INTERVAL_MS = 90_000L" in current
          assert "FIXED_V741_DETAILED_FORECAST_UNIVERSE_LIMIT = 48" in current
          assert "FIXED_V741_DISCOVERY_DYNAMIC_LIMIT = 28" in current
          assert "daily_recommendation_cap" in current
          assert 'versionCode = 8406' in Path("app/build.gradle.kts").read_text()
          assert 'versionName = "8.3.25-fixed-v8319-selection-parity"' in Path("app/build.gradle.kts").read_text()
          # Nothing else in the newer version is allowed to change with this correction.
          changed=set(subprocess.check_output(["git","diff","--name-only",v24,"HEAD"],text=True).splitlines())
          allowed={key, "app/build.gradle.kts",
              ".github/workflows/multify-v8325-selection-parity.yml",
              "docs/V8325_FIXED_PARITY_AUDIT.md"}
          assert changed <= allowed, f"Unexpected changes: {changed - allowed}"
          print("PASS: v8.3.19 Fixed 48-candidate selection, discovery ranking, scoring and publication source parity")
          PY
      - name: Offline chronological replay regression tests
        run: python -m unittest discover -s backend/tests -p 'test_adaptive_timeframe_replay.py' -v
      - name: Android unit tests and APK build
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Upload separate experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: Multify-v8325-Fixed-Selection-Parity-TEST-debug
          path: app/build/outputs/apk/debug/*.apk
