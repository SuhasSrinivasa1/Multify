name: Multify v9.0.23 Working Range Entry Band and Scan Performance / Frozen Fixed regression TEST
on:
  push:
    branches: [v9023-working-range-entry-band-scan-performance-20261120]
  pull_request:
    branches: [v9022-working-range-target-stop-momentum-20261120]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Verify Frozen Fixed model, original BUY/GTT and unchanged trailing
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          root="app/src/main/java/com/multify/traderpro/"
          repo=root+"data/repository/TradingRepository.kt"
          ref19=["30d3ab4f474fc1ed4103da5e1247b0078f484eaf",
                 "af87c4126572c6aca9a8fadea940011a13bf0ab8"]
          base28="309b50c297964bf313b26c651a1287e1795e5807"
          ref907="67cb146b057f17cc2366941e4b1597b664d8e195"
          def old(ref,path):
              return subprocess.check_output(["git","show",f"{ref}:{path}"])
          def seg(blob,from_,to_):
              a=blob.index(from_.encode())
              return blob[a:blob.index(to_.encode(),a)]
          current=Path(repo).read_bytes()
          for ref in ref19:
              source=old(ref,repo)
              for a,b in [
                  ("suspend fun generateFixedForecasts(","private fun fixedSnapshotMultifyMfeAverage("),
                  ("private suspend fun discoverFixedMarketWideCandidates(","private suspend fun fetchFixedDiscoveryLtpBatch(")]:
                  assert seg(current,a,b)==seg(source,a,b),(ref,a,"FROZEN_LIVE_FIXED_MODIFIED")
              for rel in (
                  "engine/FixedFinalContract.kt",
                  "engine/FixedMarketDiscoveryPolicy.kt",
                  "engine/FixedForecastPublicationPolicy.kt",
                  "engine/FixedForecastQualityPolicy.kt",
                  "engine/FixedLocalStrategyEngine.kt",
                  "engine/FixedFastCandidateSelectionPolicy.kt",
                  "engine/FixedEntryActionabilityPolicy.kt",
                  "engine/RecommendationPriceBandPolicy.kt",
                  "engine/FixedMultifyFactorFamilies.kt"):
                  p=root+rel
                  assert Path(p).read_bytes()==old(ref,p),p
          for rel in (
              "engine/SteppedTrailingPolicy.kt",
              "engine/NetGainTrailingPolicy.kt",
              "engine/HardStopGttTighteningPolicy.kt"):
              p=root+rel
              assert Path(p).read_bytes()==old(base28,p),p
          assert "appOwnedBuyMutex.withLock" in Path(repo).read_text()
          assert "CircuitAwareBuyPolicy.decide" in Path(repo).read_text()
          source_text=Path(repo).read_text()
          assert "GttProtectionReadinessPolicy.verified" in source_text
          assert "fixed_recommendation_execution_v9013" in source_text
          assert "!isFixedRecommendationExecutionConsumed(it.id)" in source_text
          assert "RECOMMENDATION_EVENT_CONSUMED" in source_text
          assert "recommendationId = row.id" in source_text
          assert "reserveFixedRecommendationExecution(recommendationId, symbol, reference)" in source_text
          assert "FIXED_BUY_ORDER_INTENT_RESERVED" in source_text
          assert "ORDER_INTENT_V9014" in source_text
          assert "HISTORIC_BUY_REPLAY_GHOST_CLEARED_BROKER_VERIFIED" in source_text
          assert "brokerInventoryReadMutex.withLock" in source_text
          assert "activeGttReadMutex.withLock" in source_text
          assert "headlineUsesFixedDiscovery" in source_text
          assert "WAITING · NSE MASTER HTTP 403" in source_text
          assert "BETA_SWEEP_ALPHA_CONTINUATION_V9016" in source_text
          assert "BETA_FAILED_SLOTS_SEQUENTIAL_ALPHA_REPAIR_V9016" in source_text
          assert "if (errors > 0) aborted = true" in source_text
          assert "broker_fallback_for_failed_beta_batches" in source_text
          assert "if (betaStopped.get() && alphaLiveReady)" in source_text
          master=Path(root+"data/repository/NseSymbolRepository.kt").read_text()
          parser=Path(root+"engine/NseInstrumentMasterParser.kt").read_text()
          worker=Path(root+"worker/NseSymbolSyncWorker.kt").read_text()
          app=Path(root+"MultifyApp.kt").read_text()
          assert "https://growwapi-assets.groww.in/instruments/instrument.csv" in master
          assert "NSE_HOME_URL" in master and "CookieJar" in master
          assert "GROWW_OFFICIAL_NSE_CASH" in master
          assert "parseGroww" in parser and "parseNse" in parser
          assert "KEY_UPDATED" in master and "commit()" in master
          assert "nse-symbol-master-sync-v9015" in app
          assert 'wm.cancelUniqueWork("nse-symbol-master-initial")' in app
          assert 'wm.cancelUniqueWork("nse-symbol-master-monthly")' in app
          assert "nse-symbol-master-monthly-v9015" in app
          assert "runAttemptCount < 2" in worker
          assert "allowOtherSymbolProtectionRecovery = false" in source_text
          assert "const val MAX_LOSS_PCT = 3.0" in Path(root+"engine/HardStopLossPolicy.kt").read_text()
          assert "const val HARD_STOP_LOSS_PCT = 3.0" in Path(root+"engine/ReleaseIntegrityManifest.kt").read_text()
          assert "const val CANONICAL_LEARNING_CALLS = 107" in Path(root+"engine/FixedFinalContract.kt").read_text()
          build=Path("app/build.gradle.kts").read_text()
          assert "versionCode = 9023" in build
          assert 'versionName = "9.0.23-working-range-entry-band-scan-performance"' in build
          assert "const val BETA_SAFE_LIVE_60S = 40" in Path(root+"engine/FixedResearchCapacityPolicy.kt").read_text()
          assert "const val MIN_RESEARCH_GAP_MS = 1_000L" in Path(root+"engine/FixedResearchLtpPacingPolicy.kt").read_text()
          assert "const val APP_PER_MINUTE = 45" in Path(root+"data/network/GrowwHistoricalThrottlePolicy.kt").read_text()
          assert "const val BETA_HISTORICAL_PER_MINUTE = 8" in Path(root+"engine/FixedDualAccountPolicy.kt").read_text()
          alpha=Path(root+"data/network/GrowwRateLimitInterceptor.kt").read_text()
          beta=Path(root+"data/network/BetaResearchGate.kt").read_text()
          assert "DualMinuteAdmissionPolicy.calendarWaitMs(" in alpha
          assert "DualMinuteAdmissionPolicy.calendarWaitMs(" in beta
          assert ".betaDiscoveryPreferred(" in Path(repo).read_text()
          assert "PREFETCH_YIELDED_TO_FOREGROUND_V909" in Path(repo).read_text()
          assert "INDICATOR_WARMUP_SHADOW_V909" in Path(repo).read_text()
          assert "fixed_selection_unchanged" in Path(repo).read_text()
          net=Path(root+"data/network/GrowwApiFactory.kt").read_text()
          assert net.count("BrokerWireAuditInterceptor(")==2
          assert net.count(".retryOnConnectionFailure(false)") == 2
          assert net.count(".followRedirects(false)") == 2
          assert "wire_api_usage_snapshot.json" in Path(repo).read_text()
          # v9.0.18 instrumentation must stay OUTSIDE the byte-locked
          # discovery/evaluation functions, all execution and GTT policy.
          factor=Path(root+"data/logging/FixedFactorTelemetry.kt").read_text()
          assert '"working_range_shadow_v9017"' in factor
          assert 'FixedWorkingRangeShadowPolicy.observe(' in factor
          assert 'fixed_primary_progression_v9017.json' in source_text
          assert 'PERSISTED_QUALIFIED_TIER_SCAN_START' in source_text
          working=Path(root+"engine/FixedWorkingRangeShadowPolicy.kt").read_text()
          assert 'does_not_approve_or_reject_trades' in working
          assert 'no_extra_broker_calls' in working
          assert 'working_range_qualified" to false' in working
          assert 'no_extra_broker_calls" to true' in working

          # Operator-only changes must remain outside all Frozen Fixed and broker paths.
          ui=Path(root+"ui/screens/TraderApp.kt").read_text()
          operator=Path(root+"engine/FixedOperatorButtonPolicy.kt").read_text()
          wire=Path(root+"data/network/BrokerWireAuditInterceptor.kt").read_text()
          assert "FixedOperatorButtonPolicy.decide(" in ui
          assert "appOwnedPositions = dashboard?.positions.orEmpty()" in ui
          assert "BUY EXECUTED ·" in operator and "Holding capacity" in operator
          assert "accounts[t.account]" in wire
          assert "categories[t.account + \"/\" + t.category]" in wire
          assert "endpoints[t.account + \"/\" + t.endpoint]" in wire
          assert "fixed_working_range_shadow_v9017" in Path(root+"engine/FixedWorkingRangeShadowPolicy.kt").read_text()
          # No automatic change from the currently broker-verified -3% stop.
          assert "const val MAX_LOSS_PCT = 3.0" in Path(root+"engine/HardStopLossPolicy.kt").read_text()
          # v9.0.20: independent Working Range pilot, no changes to Fixed selection/execution.
          pref=Path(root+"data/preferences/AppPreferences.kt").read_text()
          vm=Path(root+"ui/screens/TraderViewModel.kt").read_text()
          wr=Path(root+"engine/WorkingRangeCandidatePolicy.kt").read_text()
          wrstore=Path(root+"data/logging/WorkingRangeRecommendationStore.kt").read_text()
          beta=Path(root+"data/network/BetaResearchGate.kt").read_text()
          cache=Path(root+"data/network/GrowwHotDataCacheInterceptor.kt").read_text()
          assert 'booleanPreferencesKey("working_range_enabled_v9020")' in pref
          assert 'val workingRangeEnabled: Boolean = false' in pref
          assert 'onWorkingRangeChanged = viewModel::setWorkingRangeEnabled' in ui
          assert 'Working Range' in ui and 'FIXED · FROZEN v7.4.1' in ui and 'WORKING RANGE · ALPHA AUTO-BUY' in ui
          assert 'workingRangeRecommendationStore.offer(' in source_text
          assert 'workingRangeRecommendations = if (settings.workingRangeEnabled)' in source_text
          assert 'working_range_recommendations_v9021.json' in source_text
          assert 'REQUIRED_CONSECUTIVE_OBSERVATIONS = 2' in wr
          assert 'MAX_CANDIDATE_AGE_MINUTES =' in wr
          assert 'MAX_DRIFT_FROM_FIRST_QUALIFIED_PCT =' in wr
          assert 'MIN_DRIFT_FROM_FIRST_QUALIFIED_PCT =' in wr
          assert 'MAX_VWAP_EXTENSION_ATR = WorkingRangeEntryBandPolicy.MAX_VWAP_EXTENSION_ATR' in wr
          assert 'MAX_SPREAD_BPS = WorkingRangeEntryBandPolicy.MAX_SPREAD_BPS' in wr
          band=Path(root+"engine/WorkingRangeEntryBandPolicy.kt").read_text()
          assert 'MAX_FIRST_QUALIFIED_TO_BUY_MS = 120_000L' in band
          assert 'MAX_CONFIRMATION_TO_BUY_MS = 30_000L' in band
          assert 'MAX_UPWARD_DRIFT_FROM_FIRST_QUALIFIED_PCT = 0.50' in band
          assert 'MAX_DRAWDOWN_FROM_FIRST_QUALIFIED_PCT = 0.75' in band
          assert 'MAX_VWAP_EXTENSION_ATR = 3.50' in band
          assert 'MAX_SPREAD_BPS = 35.0' in band
          assert 'ENTRY_BAND_REJECTED' in source_text
          assert '"auto_buy_enabled" to enabled' in wrstore
          assert '"extra_discovery_broker_requests" to 0' in wrstore
          assert 'working_range_live_autobuy_adds_alpha_execution_and_protection_calls' in wrstore
          assert 'Working Range Auto-Buy' in ui
          assert 'workingRangeAutoBuySubmitted' in source_text
          assert 'BETA_CLIENT_GOVERNOR_WAIT' in beta and 'BETA_HTTP_429' in beta
          assert 'livePermitWaitRequests' in beta and 'historicalPermitWaitMs' in beta
          assert 'if (totalWaitMs > 0L)' in Path(root+"data/network/GrowwRateLimitInterceptor.kt").read_text()
          assert 'if (request.method != "GET" || bypassForProtection(request))' in cache
          assert 'if (request.method != "GET" || bypassForProtection(request)) return null' in cache
          assert 'withFixedHistoricalDataSlot' in source_text
          assert 'fixedHistoricalWindowStore.request(' in source_text
          assert 'brokerInventoryReadMutex.withLock' in source_text
          assert 'BETA_DISCOVERY_RESERVE' in Path(root+"engine/FixedResearchCapacityPolicy.kt").read_text()
          # v9.0.19 exclusively adds read-only marketability and shadow MCQ.
          ui=Path(root+"ui/screens/TraderApp.kt").read_text()
          factor=Path(root+"data/logging/FixedFactorTelemetry.kt").read_text()
          mcq=Path(root+"engine/FixedMomentumContinuationShadowPolicy.kt").read_text()
          marketability=Path(root+"engine/FixedQuoteMarketabilityPresentationPolicy.kt").read_text()
          dto=Path(root+"data/network/ApiModels.kt").read_text()
          assert '"momentum_continuation_shadow_v9019"' in factor
          assert '"validated_raw_book_shadow_v9019"' in factor
          assert '"changes_fixed_selection_or_execution" to false' in mcq
          assert '"working_range_certified" to false' in mcq
          assert 'CLIENT_RECEIPT_WINDOW_MS = 8_000L' in marketability
          assert '"UPPER_BAND_NO_SELL_OFFER"' in marketability
          assert 'quoteMarketabilityState' in dto and 'quoteMarketabilityState = marketability.state' in source_text
          assert '"fixed_operator_ui_transitions_v9019.json"' in source_text
          assert 'FixedUiRenderEvidenceStore.recordOperatorStateObserved(' in ui
          assert 'PRIMARY CONFIRMED · original Fixed recommendation preserved' in ui
          assert 'val pending = dashboard?.fixedEarlyWatch.orEmpty()' not in ui
          assert 'fixed_scan_observations.json' in source_text
          owner=Path(root+"engine/AppPositionOwnershipPolicy.kt").read_text()
          univest=Path(root+"engine/UnivestAutoBuyPolicy.kt").read_text()
          assert '"UNIVEST_HOLDING" to setOf("UVH")' in owner
          assert 'const val MAX_NOTIFICATION_AGE_MS = 120_000L' in univest
          assert 'ALERT_PREDATES_FIXED_TOGGLE' in univest
          assert 'NOT_UNIVEST_ENTRY' in univest
          assert 'autoBuyUnivestViaFixedToggle(signal.symbol, at, key)' in Path(repo).read_text()
          assert 'engine = ENGINE_UNIVEST_HOLDING' in Path(repo).read_text()
          assert 'HardStopLossPolicy.stopPrice(actualEntry)' in Path(repo).read_text()
          assert 'univest_exit_can_sell" to false' in Path(repo).read_text()
          # v9.0.21: live Working Range is separately opted-in; source guard has
          # immutable reservation, no blind resubmission and shared Alpha/GTT protection.
          wrbuy=Path(root+"engine/WorkingRangeAutoBuyPolicy.kt").read_text()
          wrstore=Path(root+"data/logging/WorkingRangeRecommendationStore.kt").read_text()
          wrprefs=Path(root+"data/preferences/AppPreferences.kt").read_text()
          assert "workingRangeActivatedAtMs" in wrprefs
          assert "migrateWorkingRangeToExplicitAutoBuyOptInOnce()" in wrprefs
          assert "CONFIRMED_BEFORE_ACTIVATION" in wrbuy
          assert "EVENT_ALREADY_RESERVED_OR_CONSUMED" in wrbuy
          assert "MAX_CONFIRMATION_AGE_MS = WorkingRangeEntryBandPolicy.MAX_CONFIRMATION_TO_BUY_MS" in wrbuy
          assert "MAX_CONFIRMATION_AGE_MS = 30_000L" in Path(root+"engine/WorkingRangeEntryMomentumPolicy.kt").read_text()
          assert 'working_range_recommendations_v9021' in wrstore
          assert 'persistOrderIntentDurablyLocked()' in wrstore
          assert 'WorkingRangeDistinctScanPolicy.isIndependentSecondScan(' in wrstore
          assert '.commit()' in wrstore and 'fun pendingAutoBuyIntents(dateIst: String? = null)' in wrstore
          assert 'legacy_v9020_rows_json_research_only' in wrstore
          assert 'unresolvedRangeOrders' in source_text and 'workingRangeRecommendationStore.pendingAutoBuyIntents()' in source_text
          assert 'fixedAutoBuySubmissionMutex.withLock { autoBuyWorkingRangeRecommendationsLocked() }' in source_text
          assert 'registerWorkingRangeBoughtPosition(' in source_text
          assert 'registerBoughtPositionAndProtect(' in source_text
          assert 'reference.startsWith("WRM")' in source_text
          assert 'alpha_only" to true' in source_text
          assert 'Beta remains read-only' not in wrbuy or True
          print("PASS: Frozen Fixed and independently opted-in Working Range Alpha execution with durable intent")

          PY
      - name: Historical/replay policy tests
        run: |
          python -m unittest discover -s backend/tests -p 'test_adaptive_timeframe_replay.py' -v
          python -m unittest discover -s backend/tests -p 'test_v9_master_log_replay.py' -v
      - name: Restore stable application signing key when configured
        shell: bash
        env:
          MULTIFY_KEYSTORE_BASE64: ${{ secrets.MULTIFY_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${MULTIFY_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$MULTIFY_KEYSTORE_BASE64" | base64 --decode > app/multify-v4-stable.jks
            chmod 600 app/multify-v4-stable.jks
            echo "Stable signing key restored from GitHub Actions secret."
          else
            echo "Stable signing key secret is not configured; debug APK will use runner-generated debug certificate."
          fi
      - name: Verify v9.0.23 bounded entry band, completed-history reuse and endpoint pacing
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path("app/src/main/java/com/multify/traderpro")
          src=(root/"data/repository/TradingRepository.kt").read_text()
          entry=(root/"engine/WorkingRangeEntryMomentumPolicy.kt").read_text()
          band=(root/"engine/WorkingRangeEntryBandPolicy.kt").read_text()
          exit=(root/"engine/WorkingRangeExitPolicy.kt").read_text()
          cache=(root/"data/network/GrowwHotDataCacheInterceptor.kt").read_text()
          beta=(root/"data/network/BetaResearchGate.kt").read_text()
          pacing=(root/"engine/BetaLiveEndpointPacingPolicy.kt").read_text()
          assert "MAX_CONFIRMATION_AGE_MS = 30_000L" in entry
          assert "MAX_FIRST_QUALIFIED_TO_BUY_MS = 120_000L" in band
          assert "MAX_VWAP_EXTENSION_ATR = 3.50" in band
          assert "MAX_SPREAD_BPS = 35.0" in band
          assert "HISTORICAL_15M_TTL_MS = 10 * 60_000L" in cache
          assert "bar.ts + candleDurationMs <= asOfMs" in Path(root+"engine/FixedLocalStrategyEngine.kt").read_text()
          assert "lastGrantedAtByEndpoint" in beta
          assert "BetaLiveEndpointPacingPolicy.on429(livePacing, endpoint, now)" in beta
          assert "quote429DoesNotSlowLtpDiscoveryLane" in Path("app/src/test/java/com/multify/traderpro/engine/BetaLiveEndpointPacingPolicyTest.kt").read_text()
          assert "MAX_DRAWDOWN_FROM_CONFIRMATION_PCT = 0.75" in entry
          assert "MOMENTUM_OR_AGE_REJECTED" in src
          assert "monitorWorkingRangeHoldingLocked(" in src
          assert "WORKING_RANGE_TARGET_FULL_EXIT" in exit
          assert "WORKING_RANGE_STOP_MINUS_1_FULL_EXIT" in exit
          assert "val initialStopPrice = if" in src
          assert "v0.3 Alpha Auto-Buy" in src
          assert "WORKING_RANGE_ENTRY_BAND_REJECTED" not in src or "ENTRY_BAND_REJECTED" in src
          print("PASS: isolated Working Range entry and target/stop exit")
          PY
      - name: Full Android unit tests / v9.0.23 WORKING RANGE ENTRY BAND TEST APK
        env:
          MULTIFY_KEYSTORE_PASSWORD: ${{ secrets.MULTIFY_KEYSTORE_PASSWORD }}
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK signing and SHA-256
        run: |
          apk=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f | head -n 1)
          test -n "$apk" && test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" \
            | tee app/build/outputs/apk/debug/v9023-signature-verification.txt
          cert=$(grep -m1 'Signer #1 certificate SHA-256 digest:' app/build/outputs/apk/debug/v9023-signature-verification.txt | awk '{print tolower($NF)}')
          echo "SIGNER_SHA256=$cert" | tee app/build/outputs/apk/debug/v9023-install-compatibility.txt
          if [ "$cert" = "9021b05e9a18113b689a4df2e6f242c9a70ad0cd10f8f2a8daa0b631e3b68e9c" ]; then
            echo "IN_PLACE_UPDATE_COMPATIBLE_WITH_V9018_STABLE=YES" | tee -a app/build/outputs/apk/debug/v9023-install-compatibility.txt
          else
            echo "IN_PLACE_UPDATE_COMPATIBLE_WITH_V9018_STABLE=NO_OR_UNKNOWN" | tee -a app/build/outputs/apk/debug/v9023-install-compatibility.txt
          fi
          if [ "$cert" = "829c96c7369aaf849cb4cf5f770da77ebfe569d0b640bf6f1981aaf0d024fae6" ]; then
            echo "IN_PLACE_UPDATE_COMPATIBLE_WITH_V9020_WORKING_RANGE=YES" | tee -a app/build/outputs/apk/debug/v9023-install-compatibility.txt
          else
            echo "IN_PLACE_UPDATE_COMPATIBLE_WITH_V9020_WORKING_RANGE=NO" | tee -a app/build/outputs/apk/debug/v9023-install-compatibility.txt
          fi
          if [ "$cert" = "6e0fc9f69890c8a47eaeb3612e7fb71ea1bf567d3bd1bdae5ce19ed74afe982b" ]; then
            echo "IN_PLACE_UPDATE_COMPATIBLE_WITH_V9019_TEST=YES" | tee -a app/build/outputs/apk/debug/v9023-install-compatibility.txt
          else
            echo "IN_PLACE_UPDATE_COMPATIBLE_WITH_V9019_TEST=NO" | tee -a app/build/outputs/apk/debug/v9023-install-compatibility.txt
          fi
          if [ "$cert" = "8d797e5843f03a7c954fc7a9b1c601e21a3f9e58eff4620ff9fd3795cc0b3be8" ]; then
            echo "IN_PLACE_UPDATE_FROM_V9022_DEBUG=YES" | tee -a app/build/outputs/apk/debug/v9023-install-compatibility.txt
          else
            echo "IN_PLACE_UPDATE_FROM_V9022_DEBUG=NO" | tee -a app/build/outputs/apk/debug/v9023-install-compatibility.txt
          fi
          echo "IN_PLACE_UPDATE_FROM_V9021_REQUIRES_CERTIFICATE_MATCH=YES" | tee -a app/build/outputs/apk/debug/v9023-install-compatibility.txt
          echo "Never uninstall the installed trading app to work around a signer mismatch while holdings, GTTs or unexported state exist."
          sha256sum "$apk" | tee app/build/outputs/apk/debug/v9023-SHA256SUMS.txt
      - name: Upload CI verified package
        uses: actions/upload-artifact@v4
        with:
          name: Multify-v9.0.23-Working-Range-Entry-Band-Scan-Performance-TEST-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/v9023-signature-verification.txt
            app/build/outputs/apk/debug/v9023-SHA256SUMS.txt
            app/build/outputs/apk/debug/v9023-install-compatibility.txt
