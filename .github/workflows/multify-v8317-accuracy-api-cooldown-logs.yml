name: Multify v8.3.17 Accuracy, API Cooldown & Diagnostics
on:
  push:
    branches: [v8317-accuracy-api-cooldown-logs]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Verify isolated v8.3.17 branch and protected trading execution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          base = '1e167cf64b4931c0c4eb9cdfd5756c1bc252c450'  # v8.3.16 immutable base
          root = 'app/src/main/java/com/multify/traderpro/'
          protected = [
            'engine/FixedFinalContract.kt',
            'engine/FixedForecastQualityPolicy.kt',
            'engine/FixedForecastPublicationPolicy.kt',
            'engine/FixedMarketDiscoveryPolicy.kt',
            'engine/SteppedTrailingPolicy.kt',
            'engine/HardStopLossPolicy.kt',
            'engine/HoldingSmartOrderPolicy.kt',
            'engine/GttExitReconciliationPolicy.kt',
            'engine/CircuitAwareBuyPolicy.kt',
            'engine/CashAwareCncSizing.kt',
            'engine/FixedExecutionThinLiquidityPolicy.kt',
            'data/network/GrowwApi.kt',
            'data/repository/FixedRecommendationStore.kt',
          ]
          for item in protected:
              path = root + item
              assert Path(path).read_bytes() == subprocess.check_output(['git','show',f'{base}:{path}']), 'Protected source changed: ' + item
          repo_path = root + 'data/repository/TradingRepository.kt'
          current = Path(repo_path).read_text()
          previous = subprocess.check_output(['git','show',f'{base}:{repo_path}'], text=True)
          def method(src, name):
              match = re.search(r'(?m)^\s*(?:private\s+)?(?:suspend\s+)?fun\s+' + re.escape(name) + r'\s*\(', src)
              assert match, 'Missing protected method: ' + name
              tail = src[match.start():]
              nxt = re.search(r'(?m)^\s*(?:private\s+)?(?:suspend\s+)?fun\s+', tail[match.end()-match.start():])
              return tail if not nxt else tail[:match.end()-match.start()+nxt.start()]
          for name in ['submitMarketOrder','submitFixedEntryGtt','preFixedAutoBuyExecutionGuard','placeCncBuy']:
              assert method(current,name) == method(previous,name), 'Protected order path changed: ' + name
          assert 'BudgetOnlyCncSizing.size' in current
          assert 'wallet_api_calls" to 0' in current
          assert 'allowOtherSymbolProtectionRecovery = true' in current
          assert 'allowFreshPostFillProof = true' in current
          assert 'deferProtectionRetryToMonitor = true' in current
          assert 'POST_FILL_PROTECTION_HANDED_TO_BACKGROUND_MONITOR' in current
          assert 'preFixedAutoBuyExecutionGuard(settings)' in current
          assert 'FixedAutoBuyActivatedAtMs' not in current
          assert 'fixedAutoBuyActivatedAtMs' in current
          final = Path(root + 'engine/FixedFinalContract.kt').read_text()
          assert 'CANONICAL_LEARNING_CALLS = 107' in final
          assert 'CANONICAL_MULTIFY_MFE_AVG_PCT = 1.1161043030113955' in final
          assert 'FIXED-V741-20261021-190239-FINAL' in final
          hard = Path(root + 'engine/HardStopLossPolicy.kt').read_text()
          assert 'MAX_LOSS_PCT = 5.0' in hard
          budgets = Path(root + 'engine/GrowwApiBudgetPolicy.kt').read_text()
          dual = Path(root + 'engine/FixedDualAccountPolicy.kt').read_text()
          assert 'fixedLiveDataPerMinute(hasOpenHoldings: Boolean): Int = 240' in budgets
          assert 'BETA_LIVE_PER_MINUTE = 270' in dual
          assert 'BETA_LIVE_ENDPOINT_PER_MINUTE = 40' in dual
          assert 'BETA_HISTORICAL_PER_MINUTE = 8' in dual
          assert 'FULL_NSE_LTP_BATCH_LIMIT = 50' in dual
          assert 'batchIndex % 2 == 1' in dual
          assert 'Math.floorMod(symbol.hashCode(), 4) == 0' in dual
          assert 'MAX_PER_MINUTE = 40' in Path(root + 'engine/AlphaLtpPacingPolicy.kt').read_text()
          assert 'MIN_GAP_MS = 1_000L' in Path(root + 'engine/AlphaLtpPacingPolicy.kt').read_text()
          assert 'MIN_GAP_MS = 1_000L' in Path(root + 'engine/LtpAdaptivePacingPolicy.kt').read_text()
          assert 'retryOnConnectionFailure(false)' in Path(root + 'data/network/GrowwApiFactory.kt').read_text()
          assert 'REQUEST_STARTED' in Path(root + 'data/network/GrowwHttpTraceLedger.kt').read_text()
          assert 'account_10s_at_start' in Path(root + 'data/network/GrowwHttpTraceLedger.kt').read_text()
          assert 'inFlightByEndpoint' in Path(root + 'data/network/GrowwHttpTraceLedger.kt').read_text()
          assert 'diagnosticStatus()' in Path(root + 'data/network/BetaResearchGate.kt').read_text()
          recovery = Path(root + 'data/network/GrowwRecoveryGate.kt').read_text()
          assert 'endpointCooldownUntilMs' in recovery
          assert 'on429(category, retryAfterMs, path)' in Path(root + 'data/network/GrowwRateLimitInterceptor.kt').read_text()
          assert 'endpointCooldownUntilMs' in current
          assert 'APP_PER_MINUTE = 20' in Path(root + 'data/network/GrowwHistoricalThrottlePolicy.kt').read_text()
          assert 'BETA_BATCH_SKIPPED_COOLDOWN_NO_ALPHA_FALLBACK' in current
          assert 'BETA_DETAIL_FAILED_NO_ALPHA_FALLBACK' in current
          assert 'PREFETCH_INVALID_SCAN_DEFERRED_NO_DUPLICATE_SWEEP' in current
          assert 'LIVE_SAMPLE_BATCH_PROFILE' in current
          assert 'symbols.chunked(com.multify.traderpro.engine.FixedDualAccountPolicy.FULL_NSE_LTP_BATCH_LIMIT)' in current
          assert 'broker429 || localCooldown' in current
          assert 'FixedEntrySafetyOverlay.assess(snapshot)' in Path(root + 'engine/FixedEntryActionabilityPolicy.kt').read_text()
          assert 'timestamp + intervalMs > asOfMs' in Path(root + 'engine/FixedLocalStrategyEngine.kt').read_text()
          assert 'MarketCandleTimestampParser.toEpochMillis(row[0])' in Path(root + 'engine/FixedLocalStrategyEngine.kt').read_text()
          assert 'mapIndexedNotNull' not in Path(root + 'engine/FixedLocalStrategyEngine.kt').read_text()
          assert 'val vwapNow = vwap(sessionCandles)' in Path(root + 'engine/FixedLocalStrategyEngine.kt').read_text()
          assert 'openingRange(sessionCandles, 5, interval)' in Path(root + 'engine/FixedLocalStrategyEngine.kt').read_text()
          assert 'MIN_EXCLUSIVE_RUPEES = 100.0' in Path(root + 'engine/RecommendationPriceBandPolicy.kt').read_text()
          assert 'MIN_TARGET_REENTRY_PULLBACK_PCT = 0.50' in Path(root + 'engine/FixedRepeatQualificationPolicy.kt').read_text()
          assert 'FixedFiveMinuteEntryPolicy.evaluate' in current
          assert 'THREE_FACTOR_MOMENTUM_SHADOW' in current
          assert 'scanResult = when' in Path(root + 'service/TradingEngineService.kt').read_text()
          assert 'FixedScanTrendChart()' in Path(root + 'ui/screens/TraderApp.kt').read_text()
          assert not Path(root + 'data/network/GrowwSharedMarketDataBudget.kt').exists()
          gradle = Path('app/build.gradle.kts').read_text()
          assert 'versionCode = 8398' in gradle
          assert 'versionName = "8.3.17-accuracy-api-cooldown-logs"' in gradle
          print('PASS: isolated v8.3.17; protected SELL/GTT/order methods unchanged; accuracy, API pacing, cooldown, tracing and batching guards present')
          PY
      - name: Backend tests
        run: |
          python -m pip install -r backend/requirements.txt
          PYTHONPATH="$GITHUB_WORKSPACE" PHONE_HMAC_SECRET=test-secret-test-secret-test-secret GROWW_API_KEY=test-api-key GROWW_TOTP_SECRET=JBSWY3DPEHPK3PXP python -m pytest -q backend/tests
      - name: Android unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Configure stable signing when available
        shell: bash
        env:
          MULTIFY_KEYSTORE_BASE64: ${{ secrets.MULTIFY_KEYSTORE_BASE64 }}
          MULTIFY_KEYSTORE_PASSWORD: ${{ secrets.MULTIFY_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${MULTIFY_KEYSTORE_BASE64:-}" && -n "${MULTIFY_KEYSTORE_PASSWORD:-}" ]]; then
            printf '%s' "$MULTIFY_KEYSTORE_BASE64" | base64 --decode > app/multify-v4-stable.jks
            actual="$(keytool -list -v -keystore app/multify-v4-stable.jks -storepass "$MULTIFY_KEYSTORE_PASSWORD" -alias multifyv4 | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
            expected="3f72d5c24e676c712d9e7e9feaa829960bfca9cdffc9ea4da6738372824e8755"
            test "$actual" = "$expected"
            echo "MULTIFY_KEYSTORE_PASSWORD=$MULTIFY_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "STABLE_SIGNING_READY=true" >> "$GITHUB_ENV"
          else
            echo "::warning::Stable signing unavailable; this debug APK cannot update an installation signed by another certificate."
            echo "STABLE_SIGNING_READY=false" >> "$GITHUB_ENV"
          fi
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK and package artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Multify-TraderPro-v8.3.17-accuracy-api-cooldown-logs-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/*.apk > dist/APK-SIGNATURE.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/*.apk | head -n 2 > dist/PACKAGE.txt
          grep -q "versionCode='8398'" dist/PACKAGE.txt
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          git rev-parse HEAD > dist/SOURCE-COMMIT.txt
          if [[ "${STABLE_SIGNING_READY:-false}" == "true" ]]; then
            echo "Stable v4 signing identity verified." > dist/INSTALLATION-SIGNING-STATUS.txt
          else
            echo "CI debug signing identity; cannot update a differently signed existing installation." > dist/INSTALLATION-SIGNING-STATUS.txt
          fi
          cat > dist/RELEASE-NOTES.txt <<'EOF'
          Multify Trader Pro v8.3.17
          - Verified completed candle timestamps; current-session VWAP, session high/low and independent ORB5/ORB15.
          - RSI slope-aware exhaustion scoring; session-only structure/volume factors.
          - Shadow-only 3-factor momentum and 5-minute pullback/reclaim confirmation.
          - Fail-closed BUY eligibility when verified current-session data is missing or stale; peak-extension safety overlay.
          - 0.5% observed pullback required before same-day re-entry after a recorded target hit.
          - Alpha/Beta LTP pacing, Beta concurrency and 40/min endpoint guards while preserving 80%/90% account allocations.
          - No Alpha fallback for Beta cooldown; invalid prefetch defers instead of repeating a full market sweep.
          - Fixed outcome monitoring batches at 50 symbols and stops retrying after 429/cooldown.
          - Per-request start/finish traces, 1s/10s/60s counts, endpoint totals, in-flight, HTTP errors and cooldown diagnostics.
          - Existing protected SELL, GTT, hard-stop and order execution methods unchanged.
          EOF
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          with ZipFile('dist/Multify-TraderPro-v8.3.17-exact-source.zip','w',ZIP_DEFLATED) as z:
              for p in Path('.').rglob('*'):
                  if p.is_file() and not any(x in {'.git','.gradle','build','dist'} for x in p.parts) and p.suffix.lower() != '.jks':
                      z.write(p,p.as_posix())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multify-v8317-accuracy-api-cooldown-logs
          path: dist/
          if-no-files-found: warn
