name: Multify v7.9.20 Net Profit Exit Reconciliation and Pre-Spike Quality
on:
  push:
    branches: [ v7920-net-profit-sell-reconciliation-pre-spike-quality-fixed ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Verify Fixed scoring, targets and BUY path against v7.9.19
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          base='8377e2b1fc419587c7c23dc4f53f34a7162099a6'
          def older(p): return subprocess.check_output(['git','show',f'{base}:{p}']).decode()
          def current(p): return Path(p).read_text()
          def region(s,start,end):
              i=s.index(start); j=s.index(end,i+len(start))
              return s[i:j]
          for path in [
              'app/src/main/java/com/multify/traderpro/engine/FixedMultifyFactorFamilies.kt',
              'app/src/main/java/com/multify/traderpro/engine/FixedFinalContract.kt',
              'app/src/main/java/com/multify/traderpro/engine/FixedForecastQualityPolicy.kt',
              'app/src/main/java/com/multify/traderpro/engine/FixedEntrySafetyOverlay.kt',
              'app/src/main/java/com/multify/traderpro/engine/HardStopLossPolicy.kt',
              'app/src/main/java/com/multify/traderpro/engine/SteppedTrailingPolicy.kt',
              'app/src/main/java/com/multify/traderpro/engine/ForecastEarlyEntryPolicy.kt',
              'app/src/main/java/com/multify/traderpro/engine/ForecastRepeatEntryPolicy.kt',
          ]:
              assert older(path)==current(path),path
          p='app/src/main/java/com/multify/traderpro/engine/FixedLocalStrategyEngine.kt'
          assert older(p)==current(p),'Fixed 40-factor scoring/target engine changed'
          p='app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt'
          # Multify's order submission path is byte-for-byte protected. The only allowed
          # differences inside handleMultifyBuy are trailing-state metadata/message fields.
          old_buy=region(older(p),'private suspend fun handleMultifyBuy(', '    private suspend fun handleMultifyExit(')
          new_buy=region(current(p),'private suspend fun handleMultifyBuy(', '    private suspend fun handleMultifyExit(')
          allowed=[
              ('val trailArmPct = SteppedTrailingPolicy.ARM_TRIGGER_PCT',
               'val trailArmPct = NetProfitProtectionPolicy.MIN_NET_RETURN_PCT'),
              ('Multify ARM holding · hard -2% floor · v7 fixed stepped trail 0.55→0.50 then +0.10%',
               'Multify ARM holding · hard -2% floor · cost-aware net +0.50% trail +25bps slippage reserve, +0.10% steps'),
              ('Fixed trailing arms when gain reaches +0.55%, protecting +0.50%, then ratchets by +0.10% steps.',
               'Net trailing arms after estimated +0.50% net plus 25bps execution reserve; it ratchets in +0.10% net steps. The common -2% hard stop remains active until then.'),
              ('"initial_protected_gain_pct" to SteppedTrailingPolicy.INITIAL_STOP_GAIN_PCT,',
               '"initial_protected_net_pct" to NetProfitProtectionPolicy.MIN_NET_RETURN_PCT,\n            "slippage_allowance_bps" to NetProfitProtectionPolicy.SLIPPAGE_ALLOWANCE_BPS,'),
          ]
          for old_text,new_text in allowed:
              new_buy=new_buy.replace(new_text,old_text)
          assert old_buy==new_buy,'Multify BUY execution path changed beyond approved trailing metadata'
          checks=[
              ('suspend fun executeForecast(', '    suspend fun autoBuyForecastRecommendations():', 'Forecast BUY entry path'),
              ('private suspend fun autoBuyForecastRecommendationsLocked():', '    suspend fun reconcileForecastAutoBuyOrders(', 'Forecast Auto BUY scheduler'),
              ('suspend fun executeFixed(', '    suspend fun autoBuyFixedRecommendations():', 'Fixed BUY entry path'),
              ('private suspend fun autoBuyFixedRecommendationsLocked():', '    suspend fun reconcileFixedAutoBuyOrders(', 'Fixed Auto BUY scheduler'),
              ('private suspend fun placeCncBuy(', '    private fun LongForecastEntity.toForecastDto()', 'CNC BUY submission'),
              ('private suspend fun safeAppSellScope(', '    private suspend fun portfolioMonitorCount(', 'SELL ownership guard'),
          ]
          for start,end,label in checks:
              assert region(older(p),start,end)==region(current(p),start,end),label+' changed'
          assert region(older(p),'// FIXED_FINAL_LOCK_BEGIN:','// FIXED_FINAL_LOCK_END:')==region(current(p),'// FIXED_FINAL_LOCK_BEGIN:','// FIXED_FINAL_LOCK_END:'),'Frozen Fixed contract changed'
          src=current(p)
          assert 'FIXED_V741_FORECAST_SCAN_INTERVAL_MS = 150_000L' in src
          assert 'FixedLocalStrategyEngine.buildFeatures(quote, historical, 5)' in src
          assert 'forecastMarketToken() ?: return rows.count' in src
          assert 'BETA_FIXED_COOLDOWN_RESEARCH_ALLOWED' in src
          assert 'forecastWatchlist = secondaryForecastWatchlist(today)' in src
          assert 'NetProfitProtectionPolicy.evaluate(position.entryPrice, position.quantity, highWater)' in src
          assert 'reconcileTriggeredGttChildOrder(token, pending)' in src
          assert 'orderStatus(' in src and 'orderTrades(' in src
          assert 'versionCode = 7920' in Path('app/build.gradle.kts').read_text()
          assert 'MIGRATION_16_17' in Path('app/src/main/java/com/multify/traderpro/di/AppModule.kt').read_text()
          print('PASS: Fixed scoring/targets/150s/5m and BUY paths unchanged; new SELL reconciliation and net floor present.')
          PY
      - name: Backend tests
        run: |
          python -m pip install -r backend/requirements.txt
          PYTHONPATH="$GITHUB_WORKSPACE" PHONE_HMAC_SECRET=test-secret-test-secret-test-secret GROWW_API_KEY=test-api-key GROWW_TOTP_SECRET=JBSWY3DPEHPK3PXP python -m pytest -q backend/tests
      - name: Android unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify package, version and signing; export exact source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Multify-TraderPro-v7.9.20-net-profit-sell-reconciliation-pre-spike-quality-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/*.apk > dist/APK-SIGNATURE.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/*.apk | head -n 2 > dist/PACKAGE.txt
          grep -q "name='com.multify.traderpro.vivoy73final'" dist/PACKAGE.txt
          grep -q "versionCode='7920'" dist/PACKAGE.txt
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          python - <<'PY'
          from pathlib import Path
          import zipfile
          names=Path('.git/index').exists()
          import subprocess
          tracked=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with zipfile.ZipFile('dist/Multify-TraderPro-v7.9.20-exact-source.zip','w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for name in tracked:
                  if name and Path(name).is_file() and not any(p in {'.git','.gradle','build','dist'} for p in Path(name).parts):
                      z.write(name,name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multify-v7920-net-profit-sell-reconciliation-pre-spike-quality
          path: dist/
          if-no-files-found: error
