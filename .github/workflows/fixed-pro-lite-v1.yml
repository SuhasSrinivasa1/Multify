name: Fixed Pro Lite independent APK TEST
on:
  push:
    branches: [fixed-pro-lite-independent-app-v1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Verify Fixed source invariants and isolated runtime
        run: |
          python - <<'PY'
          import pathlib,subprocess
          root=pathlib.Path("app/src/main/java/com/multify/traderpro")
          base="v9025-working-range-always-visible-us-readonly-research"
          frozen=[
            "engine/FixedLocalStrategyEngine.kt",
            "engine/FixedForecastQualityPolicy.kt",
            "engine/FixedForecastPublicationPolicy.kt",
            "engine/FixedMarketDiscoveryPolicy.kt",
            "engine/FixedFinalContract.kt",
            "engine/SteppedTrailingPolicy.kt",
            "engine/HardStopLossPolicy.kt",
            "engine/WorkingRangeCandidatePolicy.kt",
            "engine/WorkingRangeEntryMomentumPolicy.kt",
            "engine/WorkingRangeExitPolicy.kt"
          ]
          for path in frozen:
            rel="app/src/main/java/com/multify/traderpro/"+path
            old=subprocess.check_output(["git","show",f"origin/{base}:{rel}"])
            assert pathlib.Path(rel).read_bytes()==old,(path,"changed frozen model")
          manifest=pathlib.Path("app/src/main/AndroidManifest.xml").read_text()
          assert "MultifyNotificationListenerService" not in manifest
          assert 'android:label="Fixed Pro Lite"' in manifest
          service=(root/"service/TradingEngineService.kt").read_text()
          assert "startPositionMonitorWorker()" in service
          assert "monitorManagedPositions()" in service
          assert "fixedScannerEnabled" in service
          assert "sampleFixedFiveMinuteShadow" not in service
          assert "maintainArmHotPath()" not in service
          assert "requestRebind(" not in service
          view=(root/"ui/screens/FixedLiteApp.kt").read_text()
          for name in ["LitePage.FIXED","LitePage.WORKING_RANGE","LitePage.AVERAGES","LitePage.SETTINGS"]:
            assert name in view
          assert "Fixed Auto-Buy" in view and "Working Range Auto-Buy" in view
          assert "FixedLiteApp()" in (root/"MainActivity.kt").read_text()
          assert "com.multify.fixedpro.lite" in pathlib.Path("app/build.gradle.kts").read_text()
          prefs=(root/"data/preferences/AppPreferences.kt").read_text()
          assert "fixedScannerEnabled: Boolean = true" in prefs
          assert "fixedAutoBuyEnabled: Boolean = false" in prefs
          assert "workingRangeEnabled: Boolean = false" in prefs
          assert not (root/"ui/screens/TraderApp.kt").exists()
          assert not (root/"service/MultifyNotificationListenerService.kt").exists()
          print("PASS: frozen strategy, Working Range policy, separate package and independent position protection")
          PY
      - name: Run complete JVM regression and offline replay suite
        run: |
          gradle --no-daemon :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify package and signer
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" | tee app/build/outputs/apk/debug/fixed-lite-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > app/build/outputs/apk/debug/fixed-lite-package-full.txt
          head -n 2 app/build/outputs/apk/debug/fixed-lite-package-full.txt | tee app/build/outputs/apk/debug/fixed-lite-package.txt
          sha256sum "$apk" | tee app/build/outputs/apk/debug/fixed-lite-SHA256SUMS.txt
      - name: Upload debug APK and build metadata
        uses: actions/upload-artifact@v4
        with:
          name: Fixed-Pro-Lite-v1-independent-TEST-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/fixed-lite-signature.txt
            app/build/outputs/apk/debug/fixed-lite-package.txt
            app/build/outputs/apk/debug/fixed-lite-package-full.txt
            app/build/outputs/apk/debug/fixed-lite-SHA256SUMS.txt
          retention-days: 30

  ui-test:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fixed-pro-lite-independent-app-v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 35 and emulator image
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "system-images;android-35;google_apis;x86_64"
      - name: Run Compose UI tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            gradle --no-daemon :app:connectedDebugAndroidTest
            adb shell am start -n com.multify.fixedpro.lite/com.multify.traderpro.MainActivity
            sleep 8
            adb shell screencap -p /sdcard/fixed-lite-home.png
            adb pull /sdcard/fixed-lite-home.png fixed-lite-home.png
      - name: Upload UI test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fixed-Pro-Lite-Compose-UI-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            fixed-lite-home.png
          if-no-files-found: warn
          retention-days: 30
