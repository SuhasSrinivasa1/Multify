name: Multify v7.9.6 Signed APK Package
on:
  push:
    branches: [ build-v796-package ]
    paths:
      - '.github/workflows/multify-v796-package.yml'
      - 'v796/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 35
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Apply v788 baseline and independent v790 Forecast patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d v788/multify.patch.gz.b64 | gzip -d > /tmp/v788.patch
          git apply --check /tmp/v788.patch
          git apply /tmp/v788.patch
          python - <<'PY'
          from pathlib import Path
          import hashlib
          t=Path('app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt').read_text()
          lock=t.split('// FIXED_FINAL_LOCK_BEGIN:',1)[1].split('// FIXED_FINAL_LOCK_END:',1)[0]
          Path('/tmp/fixed-v788-sha').write_text(hashlib.sha256(lock.encode()).hexdigest())
          Path('/tmp/multify-buy-v788').write_text(t.split('private suspend fun handleMultify',1)[1].split('private suspend fun',1)[0] if 'private suspend fun handleMultify' in t else 'NO_HANDLER')
          PY
          base64 -d v789/forecast-reference.patch.gz.b64 | gzip -d > /tmp/v789.patch
          git apply --check /tmp/v789.patch
          git apply /tmp/v789.patch
          python - <<'PY'
          import hashlib
          from pathlib import Path
          t=Path('app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt').read_text()
          locked=t.split('// FIXED_FINAL_LOCK_BEGIN:',1)[1].split('// FIXED_FINAL_LOCK_END:',1)[0]
          Path('/tmp/fixed-v789-hash').write_text(hashlib.sha256(locked.encode()).hexdigest())
          PY
          base64 -d v790/forecast-entry-intelligence.patch.gz.b64 | gzip -d > /tmp/v790.patch
          git apply --check /tmp/v790.patch
          git apply /tmp/v790.patch
          base64 -d v791/app-owned-sell-only.patch.gz.b64 | gzip -d > /tmp/v791.patch
          git apply --check /tmp/v791.patch
          git apply /tmp/v791.patch
          python - <<'PY'
          import hashlib
          from pathlib import Path
          t=Path('app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt').read_text()
          lock=t.split('// FIXED_FINAL_LOCK_BEGIN:',1)[1].split('// FIXED_FINAL_LOCK_END:',1)[0]
          Path('/tmp/fixed-before-v792-sha').write_text(hashlib.sha256(lock.encode()).hexdigest())
          Path('/tmp/handler-before-v792').write_text(t.split('private suspend fun handleMultify',1)[1].split('private suspend fun',1)[0] if 'private suspend fun handleMultify' in t else 'NO_HANDLER')
          PY
          base64 -d v792/forecast-speed.patch.gz.b64 | gzip -d > /tmp/v792.patch
          git apply --check /tmp/v792.patch
          git apply /tmp/v792.patch
          base64 -d v793/dex-verifier-fix.patch.gz.b64 | gzip -d > /tmp/v793.patch
          git apply --check /tmp/v793.patch
          git apply /tmp/v793.patch
          python - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt')
          t=p.read_text()
          lock=t.split('// FIXED_FINAL_LOCK_BEGIN:',1)[1].split('// FIXED_FINAL_LOCK_END:',1)[0]
          Path('/tmp/fixed-before-v794-region').write_text(lock)
          Path('/tmp/multify-before-v794-handler').write_text(t.split('private suspend fun handleMultify',1)[1].split('private suspend fun',1)[0] if 'private suspend fun handleMultify' in t else 'NO_HANDLER')
          PY
          base64 -d v794/five-minute-shared-data.patch.gz.b64 | gzip -d > /tmp/v794.patch
          git apply --check /tmp/v794.patch
          git apply /tmp/v794.patch
          python - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt')
          Path('/tmp/v794-repository-snapshot').write_text(p.read_text())
          PY
          base64 -d v795/forecast-one-minute.patch.gz.b64 | gzip -d > /tmp/v795.patch
          git apply --check /tmp/v795.patch
          git apply /tmp/v795.patch
          grep -q 'versionCode = 795' app/build.gradle.kts
          grep -q 'versionName = "7.9.5-forecast-one-minute"' app/build.gradle.kts
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt')
          t=p.read_text()
          lock=t.split('// FIXED_FINAL_LOCK_BEGIN:',1)[1].split('// FIXED_FINAL_LOCK_END:',1)[0]
          old=Path('/tmp/fixed-before-v794-region').read_text()
          normalized=lock.replace('candleInterval = "5minute"','candleInterval = "15minute"').replace('FixedLocalStrategyEngine.buildFeatures(quote, historical, 5)','FixedLocalStrategyEngine.buildFeatures(quote, historical, 15)')
          assert normalized==old and lock!=old,"Fixed changed beyond approved 5-minute input adaptation"
          expected=lock
          handler=t.split('private suspend fun handleMultify',1)[1].split('private suspend fun',1)[0] if 'private suspend fun handleMultify' in t else 'NO_HANDLER'
          assert handler==Path('/tmp/multify-buy-v788').read_text()
          assert 'ForecastMultifyReferenceLedger.build(' in t
          assert 'entry_timing_v1' in t
          assert 'EXISTING_HOLDING_IMPORTED' not in t
          assert 'HOLDING_REBASED_TO_BROKER_PORTFOLIO' not in t
          assert 'require(safeAppSellScope(token, position, forceGttRefresh = true))' in t
          assert 'quarantineExternalHoldings(token)' in t
          assert 'AppPositionOwnershipPolicy' in t
          assert 'SHARED_FIXED_FULL_NSE_UPDATED' in t
          assert 'BATCH_RETRY_PENDING' in t
          assert 'sharedFixedDiscoveryPass(distinctMaster, today)' in t
          assert 'versionCode = 795' in Path('app/build.gradle.kts').read_text()
          assert lock==expected
          assert handler==Path('/tmp/multify-before-v794-handler').read_text()
          assert 'RESUMABLE_EVALUATION_PROGRESS' in t
          assert 'FORECAST_EVALUATION_TRANCHE_SIZE = 12' in t
          assert 'val features = LocalStrategyEngine.buildFeatures(quote, historical, 1)' in t
          assert 'val features = FixedLocalStrategyEngine.buildFeatures(quote, historical, 5)' in t
          assert 'candleInterval = "1minute"\n            ).requirePayload("Forecast candles $symbol")' in t
          assert '"candle_interval" to "1minute"' in t
          original=Path('/tmp/v794-repository-snapshot').read_text()
          expected_repo=original.replace('"candle_interval" to "5minute"','"candle_interval" to "1minute"').replace('candleInterval = "5minute"\n            ).requirePayload("Forecast candles $symbol")','candleInterval = "1minute"\n            ).requirePayload("Forecast candles $symbol")').replace('Insufficient forecast 5-minute candles','Insufficient forecast 1-minute candles').replace('val features = LocalStrategyEngine.buildFeatures(quote, historical, 5)','val features = LocalStrategyEngine.buildFeatures(quote, historical, 1)')
          assert t==expected_repo,"Unexpected repository changes outside Forecast 1-minute timeframe"
          assert 'Forecast candles $symbol' in t
          assert 'require(safeAppSellScope(token, position, forceGttRefresh = true))' in t
          assert handler==Path('/tmp/handler-before-v792').read_text()
          assert 'ForecastEntryTimingPolicy' in t
          import hashlib
          lock=t.split('// FIXED_FINAL_LOCK_BEGIN:',1)[1].split('// FIXED_FINAL_LOCK_END:',1)[0]
          assert normalized==old,"Unexpected Fixed formula/selection changes"
          assert lock!=old,"Requested 5-minute Fixed adaptation missing"
          print('FIXED protected rules preserved except explicitly approved 5-minute data inputs; Multify handler identical')
          PY
      - name: Apply v796 bounded Fixed incremental history and post-Fixed Forecast fairness
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          base=Path('app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt').read_text()
          Path('/tmp/repo-before-v796').write_text(base)
          Path('/tmp/fixed-scoring-sha').write_text(hashlib.sha256(Path('app/src/main/java/com/multify/traderpro/engine/FixedLocalStrategyEngine.kt').read_bytes()).hexdigest())
          Path('/tmp/multify-handler-before-v796').write_text(base.split('private suspend fun handleMultify',1)[1].split('private suspend fun',1)[0])
          PY
          base64 -d v796/fixed-speed-research.patch.gz.b64 | gzip -d > /tmp/v796.patch
          git apply --check /tmp/v796.patch
          git apply /tmp/v796.patch
          python - <<'PY'
          from pathlib import Path
          import hashlib
          t=Path('app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt').read_text()
          prior=Path('/tmp/repo-before-v796').read_text()
          assert t!=prior
          assert 'versionCode = 796' in Path('app/build.gradle.kts').read_text()
          assert 'versionName = "7.9.6-fixed-history-forecast-fairness"' in Path('app/build.gradle.kts').read_text()
          assert hashlib.sha256(Path('app/src/main/java/com/multify/traderpro/engine/FixedLocalStrategyEngine.kt').read_bytes()).hexdigest()==Path('/tmp/fixed-scoring-sha').read_text()
          handler=t.split('private suspend fun handleMultify',1)[1].split('private suspend fun',1)[0]
          assert handler==Path('/tmp/multify-handler-before-v796').read_text()
          assert 'require(safeAppSellScope(token, position, forceGttRefresh = true))' in t
          assert 'quarantineExternalHoldings(token)' in t
          assert 'AppPositionOwnershipPolicy' in t
          assert 'FixedLocalStrategyEngine.buildFeatures(quote, historical, 5)' in t
          assert 'LocalStrategyEngine.buildFeatures(quote, historical, 1)' in t
          assert 'FixedHistoricalWindowStore' in t
          assert 'HISTORICAL_WINDOW_AND_PHASE_PROFILE' in t
          assert 'forecastPostFixedOpportunity' in t
          assert Path('app/src/test/java/com/multify/traderpro/engine/FixedHistoricalWindowStoreTest.kt').exists()
          print('v796: Fixed scorer, Multify BUY, SELL ownership, and 5m/1m candle settings verified')
          PY
      - name: Backend tests
        shell: bash
        run: |
          python -m pip install -r backend/requirements.txt
          PYTHONPATH="$GITHUB_WORKSPACE" PHONE_HMAC_SECRET=test-secret-test-secret-test-secret GROWW_API_KEY=test-api-key GROWW_TOTP_SECRET=JBSWY3DPEHPK3PXP python -m pytest -q backend/tests
      - name: Android unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify package and export artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Multify-TraderPro-v7.9.6-forecast-one-minute-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/*.apk > dist/APK-SIGNATURE.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/*.apk | head -n 2 > dist/PACKAGE.txt
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          python - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('dist/Multify-TraderPro-v7.9.6-exact-source.zip','w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
            for p in Path('.').rglob('*'):
              if not p.is_file() or any(s in {'.git','.gradle','build','dist','v788','v789','v790','v791','v792','v793','v794','v795','v796'} for s in p.parts):continue
              z.write(p,p.as_posix())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multify-v796-package
          path: dist/
          if-no-files-found: warn
