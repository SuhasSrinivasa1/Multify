name: Multify v8.3.26 Latency and Real 5m Shadow
on:
  push:
    branches: [v8326-scan-latency-5m-postmarket-shadow]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity-unit-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Verify production selection and publication match both v8.3.19 refs
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          v19s=["30d3ab4f474fc1ed4103da5e1247b0078f484eaf",
                "af87c4126572c6aca9a8fadea940011a13bf0ab8"]
          v25="30d931ffecb4471641707c95977cb4b1b9c7420b"
          prefix="app/src/main/java/com/multify/traderpro/"
          repo=prefix+"data/repository/TradingRepository.kt"
          def read(ref,path):
              return subprocess.check_output(["git","show",f"{ref}:{path}"],text=True)
          def section(text,head,tail):
              i=text.index(head)
              return text[i:text.index(tail,i)]
          current=Path(repo).read_text()
          production=[
              ("suspend fun generateFixedForecasts(",
                "private fun fixedSnapshotMultifyMfeAverage("),
              ("private suspend fun discoverFixedMarketWideCandidates(",
                "private suspend fun fetchFixedDiscoveryLtpBatch(")]
          for baseline in v19s:
              original=read(baseline,repo)
              for start,end in production:
                  assert section(current,start,end)==section(original,start,end), f"Fixed decision drift {baseline}: {start}"
              for p in [
                  "engine/FixedFinalContract.kt",
                  "engine/FixedMarketDiscoveryPolicy.kt",
                  "engine/FixedForecastPublicationPolicy.kt",
                  "engine/FixedForecastQualityPolicy.kt",
                  "engine/FixedLocalStrategyEngine.kt",
                  "engine/FixedFastCandidateSelectionPolicy.kt",
                  "engine/FixedEntryActionabilityPolicy.kt",
                  "engine/RecommendationPriceBandPolicy.kt",
                  "engine/FixedMultifyFactorFamilies.kt",
              ]:
                  f=prefix+p
                  assert Path(f).read_bytes()==subprocess.check_output(["git","show",f"{baseline}:{f}"]), f"Fixed policy drift: {f}"
          assert "asOfMs = reference.quoteCapturedAtMs" in current
          assert '"can_block_recommendations" to verdict.canBlockRecommendation' in current
          assert "FixedFiveMinuteForwardCandlePolicy" in current
          assert "sampleFixedFiveMinuteShadow(0, afterClose = true)" in Path(prefix+"service/TradingEngineService.kt").read_text()
          gradle=Path("app/build.gradle.kts").read_text()
          assert "versionCode = 8407" in gradle
          assert 'versionName = "8.3.26-latency-5m-afterclose-shadow"' in gradle
          changed=set(subprocess.check_output(["git","diff","--name-only",v25,"HEAD"],text=True).splitlines())
          allowed={
              repo, prefix+"data/repository/FixedFiveMinuteShadowJournal.kt",
              prefix+"service/TradingEngineService.kt",
              prefix+"engine/FixedScanLatencyShadowPolicy.kt",
              prefix+"engine/FixedFiveMinuteForwardCandlePolicy.kt",
              "app/build.gradle.kts",
              "app/src/test/java/com/multify/traderpro/engine/FixedScanLatencyShadowPolicyTest.kt",
              "app/src/test/java/com/multify/traderpro/engine/FixedFiveMinuteForwardCandlePolicyTest.kt",
              "app/src/test/java/com/multify/traderpro/data/repository/FixedFiveMinuteShadowCohortTest.kt",
              ".github/workflows/multify-v8326-latency-5m-shadow.yml",
              "docs/V8326_LATENCY_5M_CANDLE_SHADOW.md"}
          assert changed<=allowed, f"UNAUTHORIZED CHANGES: {changed-allowed}"
          print("PASS v8.3.19 frozen candidate/ranking/publication source parity")
          PY
      - name: Offline chronological replay tests
        run: python -m unittest discover -s backend/tests -p 'test_adaptive_timeframe_replay.py' -v
      - name: Android unit tests and APK build
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Upload separate TEST APK
        uses: actions/upload-artifact@v4
        with:
          name: Multify-v8326-Latency-Real5m-Shadow-TEST-debug
          path: app/build/outputs/apk/debug/*.apk
