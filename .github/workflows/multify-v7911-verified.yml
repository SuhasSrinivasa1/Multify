name: Multify v7.9.11 Common -2 Percent Stop Protection
on:
  push:
    branches: [ v7911-common-two-percent-stop ]
    paths:
      - '.github/workflows/multify-v7911-verified.yml'
      - 'v797/**'
      - 'v798/**'
      - 'v799/**'
      - 'v7910/**'
      - 'v7911/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 35
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Apply v788 baseline and independent v790 Forecast patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d v788/multify.patch.gz.b64 | gzip -d > /tmp/v788.patch
          git apply --check /tmp/v788.patch
          git apply /tmp/v788.patch
          python - <<'PY'
          from pathlib import Path
          import hashlib
          t=Path('app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt').read_text()
          lock=t.split('// FIXED_FINAL_LOCK_BEGIN:',1)[1].split('// FIXED_FINAL_LOCK_END:',1)[0]
          Path('/tmp/fixed-v788-sha').write_text(hashlib.sha256(lock.encode()).hexdigest())
          Path('/tmp/multify-buy-v788').write_text(t.split('private suspend fun handleMultify',1)[1].split('private suspend fun',1)[0] if 'private suspend fun handleMultify' in t else 'NO_HANDLER')
          PY
          base64 -d v789/forecast-reference.patch.gz.b64 | gzip -d > /tmp/v789.patch
          git apply --check /tmp/v789.patch
          git apply /tmp/v789.patch
          python - <<'PY'
          import hashlib
          from pathlib import Path
          t=Path('app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt').read_text()
          locked=t.split('// FIXED_FINAL_LOCK_BEGIN:',1)[1].split('// FIXED_FINAL_LOCK_END:',1)[0]
          Path('/tmp/fixed-v789-hash').write_text(hashlib.sha256(locked.encode()).hexdigest())
          PY
          base64 -d v790/forecast-entry-intelligence.patch.gz.b64 | gzip -d > /tmp/v790.patch
          git apply --check /tmp/v790.patch
          git apply /tmp/v790.patch
          base64 -d v791/app-owned-sell-only.patch.gz.b64 | gzip -d > /tmp/v791.patch
          git apply --check /tmp/v791.patch
          git apply /tmp/v791.patch
          python - <<'PY'
          import hashlib
          from pathlib import Path
          t=Path('app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt').read_text()
          lock=t.split('// FIXED_FINAL_LOCK_BEGIN:',1)[1].split('// FIXED_FINAL_LOCK_END:',1)[0]
          Path('/tmp/fixed-before-v792-sha').write_text(hashlib.sha256(lock.encode()).hexdigest())
          Path('/tmp/handler-before-v792').write_text(t.split('private suspend fun handleMultify',1)[1].split('private suspend fun',1)[0] if 'private suspend fun handleMultify' in t else 'NO_HANDLER')
          PY
          base64 -d v792/forecast-speed.patch.gz.b64 | gzip -d > /tmp/v792.patch
          git apply --check /tmp/v792.patch
          git apply /tmp/v792.patch
          base64 -d v793/dex-verifier-fix.patch.gz.b64 | gzip -d > /tmp/v793.patch
          git apply --check /tmp/v793.patch
          git apply /tmp/v793.patch
          python - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt')
          t=p.read_text()
          lock=t.split('// FIXED_FINAL_LOCK_BEGIN:',1)[1].split('// FIXED_FINAL_LOCK_END:',1)[0]
          Path('/tmp/fixed-before-v794-region').write_text(lock)
          Path('/tmp/multify-before-v794-handler').write_text(t.split('private suspend fun handleMultify',1)[1].split('private suspend fun',1)[0] if 'private suspend fun handleMultify' in t else 'NO_HANDLER')
          PY
          base64 -d v794/five-minute-shared-data.patch.gz.b64 | gzip -d > /tmp/v794.patch
          git apply --check /tmp/v794.patch
          git apply /tmp/v794.patch
          python - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt')
          Path('/tmp/v794-repository-snapshot').write_text(p.read_text())
          PY
          base64 -d v795/forecast-one-minute.patch.gz.b64 | gzip -d > /tmp/v795.patch
          git apply --check /tmp/v795.patch
          git apply /tmp/v795.patch
          grep -q 'versionCode = 795' app/build.gradle.kts
          grep -q 'versionName = "7.9.5-forecast-one-minute"' app/build.gradle.kts
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt')
          t=p.read_text()
          lock=t.split('// FIXED_FINAL_LOCK_BEGIN:',1)[1].split('// FIXED_FINAL_LOCK_END:',1)[0]
          old=Path('/tmp/fixed-before-v794-region').read_text()
          normalized=lock.replace('candleInterval = "5minute"','candleInterval = "15minute"').replace('FixedLocalStrategyEngine.buildFeatures(quote, historical, 5)','FixedLocalStrategyEngine.buildFeatures(quote, historical, 15)')
          assert normalized==old and lock!=old,"Fixed changed beyond approved 5-minute input adaptation"
          expected=lock
          handler=t.split('private suspend fun handleMultify',1)[1].split('private suspend fun',1)[0] if 'private suspend fun handleMultify' in t else 'NO_HANDLER'
          assert handler==Path('/tmp/multify-buy-v788').read_text()
          assert 'ForecastMultifyReferenceLedger.build(' in t
          assert 'entry_timing_v1' in t
          assert 'EXISTING_HOLDING_IMPORTED' not in t
          assert 'HOLDING_REBASED_TO_BROKER_PORTFOLIO' not in t
          assert 'require(safeAppSellScope(token, position, forceGttRefresh = true))' in t
          assert 'quarantineExternalHoldings(token)' in t
          assert 'AppPositionOwnershipPolicy' in t
          assert 'SHARED_FIXED_FULL_NSE_UPDATED' in t
          assert 'BATCH_RETRY_PENDING' in t
          assert 'sharedFixedDiscoveryPass(distinctMaster, today)' in t
          assert 'versionCode = 795' in Path('app/build.gradle.kts').read_text()
          assert lock==expected
          assert handler==Path('/tmp/multify-before-v794-handler').read_text()
          assert 'RESUMABLE_EVALUATION_PROGRESS' in t
          assert 'FORECAST_EVALUATION_TRANCHE_SIZE = 12' in t
          assert 'val features = LocalStrategyEngine.buildFeatures(quote, historical, 1)' in t
          assert 'val features = FixedLocalStrategyEngine.buildFeatures(quote, historical, 5)' in t
          assert 'candleInterval = "1minute"\n            ).requirePayload("Forecast candles $symbol")' in t
          assert '"candle_interval" to "1minute"' in t
          original=Path('/tmp/v794-repository-snapshot').read_text()
          expected_repo=original.replace('"candle_interval" to "5minute"','"candle_interval" to "1minute"').replace('candleInterval = "5minute"\n            ).requirePayload("Forecast candles $symbol")','candleInterval = "1minute"\n            ).requirePayload("Forecast candles $symbol")').replace('Insufficient forecast 5-minute candles','Insufficient forecast 1-minute candles').replace('val features = LocalStrategyEngine.buildFeatures(quote, historical, 5)','val features = LocalStrategyEngine.buildFeatures(quote, historical, 1)')
          assert t==expected_repo,"Unexpected repository changes outside Forecast 1-minute timeframe"
          assert 'Forecast candles $symbol' in t
          assert 'require(safeAppSellScope(token, position, forceGttRefresh = true))' in t
          assert handler==Path('/tmp/handler-before-v792').read_text()
          assert 'ForecastEntryTimingPolicy' in t
          import hashlib
          lock=t.split('// FIXED_FINAL_LOCK_BEGIN:',1)[1].split('// FIXED_FINAL_LOCK_END:',1)[0]
          assert normalized==old,"Unexpected Fixed formula/selection changes"
          assert lock!=old,"Requested 5-minute Fixed adaptation missing"
          print('FIXED protected rules preserved except explicitly approved 5-minute data inputs; Multify handler identical')
          PY
      - name: Apply v796 bounded Fixed incremental history and post-Fixed Forecast fairness
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          base=Path('app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt').read_text()
          Path('/tmp/repo-before-v796').write_text(base)
          Path('/tmp/fixed-scoring-sha').write_text(hashlib.sha256(Path('app/src/main/java/com/multify/traderpro/engine/FixedLocalStrategyEngine.kt').read_bytes()).hexdigest())
          Path('/tmp/multify-handler-before-v796').write_text(base.split('private suspend fun handleMultify',1)[1].split('private suspend fun',1)[0])
          PY
          base64 -d v796/fixed-speed-research.patch.gz.b64 | gzip -d > /tmp/v796.patch
          git apply --check /tmp/v796.patch
          git apply /tmp/v796.patch
          python - <<'PY'
          from pathlib import Path
          import hashlib
          t=Path('app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt').read_text()
          prior=Path('/tmp/repo-before-v796').read_text()
          assert t!=prior
          assert 'versionCode = 796' in Path('app/build.gradle.kts').read_text()
          assert 'versionName = "7.9.6-fixed-history-forecast-fairness"' in Path('app/build.gradle.kts').read_text()
          assert hashlib.sha256(Path('app/src/main/java/com/multify/traderpro/engine/FixedLocalStrategyEngine.kt').read_bytes()).hexdigest()==Path('/tmp/fixed-scoring-sha').read_text()
          handler=t.split('private suspend fun handleMultify',1)[1].split('private suspend fun',1)[0]
          assert handler==Path('/tmp/multify-handler-before-v796').read_text()
          assert 'require(safeAppSellScope(token, position, forceGttRefresh = true))' in t
          assert 'quarantineExternalHoldings(token)' in t
          assert 'AppPositionOwnershipPolicy' in t
          assert 'FixedLocalStrategyEngine.buildFeatures(quote, historical, 5)' in t
          assert 'LocalStrategyEngine.buildFeatures(quote, historical, 1)' in t
          assert 'FixedHistoricalWindowStore' in t
          assert 'HISTORICAL_WINDOW_AND_PHASE_PROFILE' in t
          assert 'forecastPostFixedOpportunity' in t
          assert Path('app/src/test/java/com/multify/traderpro/engine/FixedHistoricalWindowStoreTest.kt').exists()
          print('v796: Fixed scorer, Multify BUY, SELL ownership, and 5m/1m candle settings verified')
          PY
      - name: Apply v797 targeted ARM, Forecast retry and Fixed history eligibility fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          t=Path('app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt').read_text()
          Path('/tmp/repo-before-v797').write_text(t)
          Path('/tmp/v797-fixed-lock').write_text(t.split('// FIXED_FINAL_LOCK_BEGIN:',1)[1].split('// FIXED_FINAL_LOCK_END:',1)[0])
          Path('/tmp/v797-buy-handler').write_text(t.split('private suspend fun handleMultify',1)[1].split('private suspend fun',1)[0])
          PY
          base64 -d v797/arm-forecast-fixed-reuse.patch.gz.b64 | gzip -d > /tmp/v797.patch
          git apply --check /tmp/v797.patch
          git apply /tmp/v797.patch
          python - <<'PY'
          from pathlib import Path
          import hashlib
          t=Path('app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt').read_text()
          lock=t.split('// FIXED_FINAL_LOCK_BEGIN:',1)[1].split('// FIXED_FINAL_LOCK_END:',1)[0]
          diagnostic_start='        if (incremental == null) {\n            val reason = fixedHistoricalWindowStore.ineligibilityReason(historyKey, start, SystemClock.elapsedRealtime())'
          original=Path('/tmp/v797-fixed-lock').read_text()
          assert diagnostic_start in lock
          prefix,rem=lock.split(diagnostic_start,1)
          assert rem.startswith('\n            // Sample at most one diagnostic every 15 seconds; do not slow the Fixed pipeline.')
          diag,tail=rem.split('        val raw = withFixedHistoricalDataSlot {',1)
          normalized=prefix+'        val raw = withFixedHistoricalDataSlot {'+tail
          assert normalized==original,'Fixed protected decision region changed beyond bounded cache diagnostic'
          assert t.split('private suspend fun handleMultify',1)[1].split('private suspend fun',1)[0]==Path('/tmp/v797-buy-handler').read_text()
          assert 'versionCode = 797' in Path('app/build.gradle.kts').read_text()
          assert 'versionName = "7.9.7-fixed-reuse-arm-forecast-retry"' in Path('app/build.gradle.kts').read_text()
          assert 'EVALUATION_RETRY_QUEUED' in t
          assert 'ARM_REJECTED' in t
          assert 'HISTORICAL_REUSE_SKIPPED' in t
          assert 'FixedLocalStrategyEngine.buildFeatures(quote, historical, 5)' in t
          assert 'LocalStrategyEngine.buildFeatures(quote, historical, 1)' in t
          assert 'require(safeAppSellScope(token, position, forceGttRefresh = true))' in t
          assert 'AppPositionOwnershipPolicy' in t
          print('Fixed 5m protected rules, Forecast 1m, Multify BUY, ownership guard preserved')
          PY
      - name: Apply v798 null-safe broker inventory without changing Fixed engine
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          repo = Path('app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt').read_text()
          Path('/tmp/v798-fixed-lock').write_text(repo.split('// FIXED_FINAL_LOCK_BEGIN:',1)[1].split('// FIXED_FINAL_LOCK_END:',1)[0])
          Path('/tmp/v798-fixed-scorer-sha').write_text(hashlib.sha256(Path('app/src/main/java/com/multify/traderpro/engine/FixedLocalStrategyEngine.kt').read_bytes()).hexdigest())
          Path('/tmp/v798-multify-buy-handler').write_text(repo.split('private suspend fun handleMultify',1)[1].split('private suspend fun',1)[0])
          PY
          base64 -d v798/broker-inventory-null-safe.patch.gz.b64 | gzip -d > /tmp/v798.patch
          git apply --check /tmp/v798.patch
          git apply /tmp/v798.patch
          python - <<'PY'
          from pathlib import Path
          import hashlib
          code = Path('app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt').read_text()
          lock = code.split('// FIXED_FINAL_LOCK_BEGIN:',1)[1].split('// FIXED_FINAL_LOCK_END:',1)[0]
          assert lock == Path('/tmp/v798-fixed-lock').read_text(), 'Fixed protected engine changed'
          scorer = Path('app/src/main/java/com/multify/traderpro/engine/FixedLocalStrategyEngine.kt')
          assert hashlib.sha256(scorer.read_bytes()).hexdigest() == Path('/tmp/v798-fixed-scorer-sha').read_text(), 'Fixed scorer changed'
          handler = code.split('private suspend fun handleMultify',1)[1].split('private suspend fun',1)[0]
          assert handler == Path('/tmp/v798-multify-buy-handler').read_text(), 'Multify buy handler changed'
          assert 'versionCode = 798' in Path('app/build.gradle.kts').read_text()
          assert 'BrokerInventorySymbolPolicy.normalize' in code
          assert Path('app/src/test/java/com/multify/traderpro/engine/BrokerInventorySymbolPolicyTest.kt').exists()
          assert 'require(safeAppSellScope(token, position, forceGttRefresh = true))' in code
          print('v798: Fixed protected scoring, 5-minute candles, Multify buying and ownership SELL rules unchanged')
          PY
      - name: Apply v799 Fixed cooldown guard and complete learning restore
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt')
          code=p.read_text()
          Path('/tmp/v799-fixed-scorer-sha').write_text(hashlib.sha256(Path('app/src/main/java/com/multify/traderpro/engine/FixedLocalStrategyEngine.kt').read_bytes()).hexdigest())
          Path('/tmp/v799-fixed-lock').write_text(code.split('// FIXED_FINAL_LOCK_BEGIN:',1)[1].split('// FIXED_FINAL_LOCK_END:',1)[0])
          Path('/tmp/v799-multify-handler').write_text(code.split('private suspend fun handleMultify',1)[1].split('private suspend fun',1)[0])
          PY
          base64 -d v799/full-reliability-learning.patch.gz.b64 | gzip -d > /tmp/v799.patch
          git apply --check /tmp/v799.patch
          git apply /tmp/v799.patch
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt')
          code=p.read_text()
          before=Path('/tmp/v799-fixed-lock').read_text()
          after=code.split('// FIXED_FINAL_LOCK_BEGIN:',1)[1].split('// FIXED_FINAL_LOCK_END:',1)[0]
          assert 'val evaluatedBySymbol = linkedMapOf<String, FixedStrategyEvaluation>()' in after
          assert 'FIXED_V741_FORECAST_SCAN_INTERVAL_MS = 150_000L' in code
          assert 'FixedLocalStrategyEngine.buildFeatures(quote, historical, 5)' in code
          assert 'LocalStrategyEngine.buildFeatures(quote, historical, 1)' in code
          assert 'SCAN_DEFERRED_BROKER' in code
          assert 'forecast_positive_evidence.json' in code
          assert 'fixed_recommendations.json' in code
          assert 'FIXED_MISSES_IMPORTED_TO_SHADOW' in code
          assert 'versionCode = 799' in Path('app/build.gradle.kts').read_text()
          assert 'versionName = "7.9.9-fixed-preserve-forecast-research"' in Path('app/build.gradle.kts').read_text()
          assert hashlib.sha256(Path('app/src/main/java/com/multify/traderpro/engine/FixedLocalStrategyEngine.kt').read_bytes()).hexdigest()==Path('/tmp/v799-fixed-scorer-sha').read_text()
          assert code.split('private suspend fun handleMultify',1)[1].split('private suspend fun',1)[0]==Path('/tmp/v799-multify-handler').read_text()
          # Any protected-region change is a broker-availability early exit, not a scorer,
          # candidate selection, target, timeframe, ranking, or trailing alteration.
          assert after.count('if (!marketDataAvailableForFixed())')==2
          assert before.count('if (!marketDataAvailableForFixed())')==0
          assert 'FixedForecastPublicationPolicy.isReady(' in after
          assert 'val publishable = unseen.filter' in after
          assert 'val targetPct = FixedFinalContract' in after or 'val targetPct =' in after
          print('v799 locked Fixed scorer, 150s cadence, 5m/1m inputs, Multify BUY, SELL protections PASS')
          PY
      - name: Apply v799 resumable research replay retry policy
        shell: bash
        run: |
          set -euo pipefail
          base64 -d v799/forecast-replay-retry.patch.gz.b64 | gzip -d > /tmp/v799-replay.patch
          git apply --check /tmp/v799-replay.patch
          git apply /tmp/v799-replay.patch
          python - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt').read_text()
          assert 'forecastReplayRetryAfterMs' in s
          assert 'OUTCOME_REPLAY_DEFERRED' in s
          assert 'FIXED_V741_FORECAST_SCAN_INTERVAL_MS = 150_000L' in s
          assert 'FixedLocalStrategyEngine.buildFeatures(quote, historical, 5)' in s
          print('v799 replay: rotating backfill retries enabled, Fixed cadence unchanged')
          PY
      - name: Apply v7910 BUY toggle, ARM and entry safety update
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          src=Path('app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt').read_text()
          Path('/tmp/fixed-lock-7910').write_text(src.split('// FIXED_FINAL_LOCK_BEGIN:',1)[1].split('// FIXED_FINAL_LOCK_END:',1)[0])
          Path('/tmp/multify-handler-7910').write_text(src.split('private suspend fun handleMultify',1)[1].split('private suspend fun',1)[0])
          for name in ('FixedLocalStrategyEngine.kt','SteppedTrailingPolicy.kt'):
            p=Path('app/src/main/java/com/multify/traderpro/engine')/name
            Path('/tmp/'+name+'.sha').write_text(hashlib.sha256(p.read_bytes()).hexdigest())
          PY
          python - <<'PY'
          from pathlib import Path
          p=Path('v7910/toggle-readiness.patch.gz.b64')
          s=p.read_text()
          old='NpORd6uO9'
          new='NpORd6UO9'
          assert s.count(old)==1, 'Expected exact single-byte transfer correction'
          p.write_text(s.replace(old,new))
          PY
          base64 -d v7910/toggle-readiness.patch.gz.b64 | gzip -d > /tmp/v7910.patch
          git apply --check /tmp/v7910.patch
          git apply /tmp/v7910.patch
          python - <<'PY'
          from pathlib import Path
          import hashlib
          app=Path('app/src/main/java/com/multify/traderpro/ui/screens/TraderApp.kt')
          s=app.read_text()
          unsafe='enabled = true // allow tap so ARM rejection reason is displayed; broker guards remain strict)'
          assert s.count(unsafe)==1,'Expected exact ARM toggle expression for syntax correction'
          app.write_text(s.replace(unsafe,'enabled = true) // Allow tap to display the ARM rejection reason.'))
          src=Path('app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt').read_text()
          assert src.split('// FIXED_FINAL_LOCK_BEGIN:',1)[1].split('// FIXED_FINAL_LOCK_END:',1)[0] == Path('/tmp/fixed-lock-7910').read_text(), 'Fixed locked decision region changed'
          assert src.split('private suspend fun handleMultify',1)[1].split('private suspend fun',1)[0] == Path('/tmp/multify-handler-7910').read_text(), 'Multify handler changed'
          for name in ('FixedLocalStrategyEngine.kt','SteppedTrailingPolicy.kt'):
            p=Path('app/src/main/java/com/multify/traderpro/engine')/name
            assert hashlib.sha256(p.read_bytes()).hexdigest()==Path('/tmp/'+name+'.sha').read_text(),name+' source changed'
          gradle=Path('app/build.gradle.kts').read_text()
          assert 'versionCode = 7910' in gradle
          assert 'versionName = "7.9.10-auto-buy-readiness-guards"' in gradle
          assert 'FIXED_V741_FORECAST_SCAN_INTERVAL_MS = 150_000L' in src
          assert 'FixedLocalStrategyEngine.buildFeatures(quote, historical, 5)' in src
          assert 'LocalStrategyEngine.buildFeatures(quote, historical, 1)' in src
          assert 'ENTRY_SKIPPED_STALE_RECOMMENDATION' in src
          assert 'ENTRY_SKIPPED_EXPIRED_DURING_PREP' in src
          assert 'BUY_BLOCKED_CALIBRATION' in src
          assert 'ENABLE_REJECTED_CALIBRATION' in src
          assert 'buyApiCooldownOrNull' in src
          assert 'ARM_REJECTED' in src
          assert 'BrokerInventorySymbolPolicy.normalize' in src
          assert Path('app/src/test/java/com/multify/traderpro/engine/AutoBuyEntrySafetyPolicyTest.kt').exists()
          print('v7910: Fixed LOCK, scorer and trailing unchanged; ARM, Fixed and Forecast BUY safety fixes verified')
          PY
      - name: Apply common minus two percent hard stop (Multify, Fixed, Forecast)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          repo = Path('app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt').read_text()
          Path('/tmp/v7911-fixed-region').write_text(repo.split('// FIXED_FINAL_LOCK_BEGIN:',1)[1].split('// FIXED_FINAL_LOCK_END:',1)[0])
          Path('/tmp/v7911-multify-buy').write_text(repo.split('private suspend fun handleMultify',1)[1].split('private suspend fun',1)[0])
          for file in ('FixedLocalStrategyEngine.kt', 'SteppedTrailingPolicy.kt','FixedFinalContract.kt'):
            path=Path('app/src/main/java/com/multify/traderpro/engine')/file
            Path('/tmp/v7911-'+file+'.sha').write_text(hashlib.sha256(path.read_bytes()).hexdigest())
          PY
          python v7911/apply_common_stop.py
          python - <<'PY'
          from pathlib import Path
          import hashlib
          repo=Path('app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt').read_text()
          lock=repo.split('// FIXED_FINAL_LOCK_BEGIN:',1)[1].split('// FIXED_FINAL_LOCK_END:',1)[0]
          assert lock==Path('/tmp/v7911-fixed-region').read_text(), 'Fixed protected region changed'
          handler=repo.split('private suspend fun handleMultify',1)[1].split('private suspend fun',1)[0]
