name: Multify v7.9.31 Fixed v7.9.1 Input Parity and Entry Toggles Off
on:
  push:
    branches: [v7931-fixed-v791-parity-default-off]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Verify Fixed baseline, independent Alpha-Beta and execution safety
        run: |
          set -euo pipefail
          git fetch --no-tags origin v7930-forecast-replay-candle-parser
          python - <<'PY'
          from pathlib import Path
          import subprocess
          root = Path("app/src/main/java/com/multify/traderpro")
          def previous(path):
              return subprocess.check_output(["git","show",f"origin/v7930-forecast-replay-candle-parser:{path}"]).decode()
          unchanged=[
              "engine/FixedForecastQualityPolicy.kt",
              "engine/FixedMarketDiscoveryPolicy.kt",
              "engine/FixedForecastPublicationPolicy.kt",
              "engine/FixedMultifyFactorFamilies.kt",
              "engine/FixedFinalContract.kt",
              "engine/HardStopLossPolicy.kt",
              "engine/SteppedTrailingPolicy.kt",
              "data/network/GrowwApiFactory.kt",
              "data/network/BetaReadOnlyInterceptor.kt",
              "data/network/BetaResearchGate.kt",
              "data/network/GrowwRateLimitInterceptor.kt",
              "data/network/GrowwModels.kt",
              "engine/ForecastEarlyEntryPolicy.kt",
              "engine/ForecastEntryTimingPolicy.kt",
              "engine/ForecastPublicationPolicy.kt",
              "engine/LocalStrategyEngine.kt"
          ]
          for name in unchanged:
              path="app/src/main/java/com/multify/traderpro/"+name
              assert Path(path).read_text()==previous(path),name+" changed unexpectedly"
          src=(root/"data/repository/TradingRepository.kt").read_text()
          prior=previous("app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt")
          def region(s,a,b):
              x=s.index(a);y=s.index(b,x+len(a))
              return s[x:y+len(b)]
          lock=region(src,"// FIXED_FINAL_LOCK_BEGIN","// FIXED_FINAL_LOCK_END")
          previous_lock=region(prior,"// FIXED_FINAL_LOCK_BEGIN","// FIXED_FINAL_LOCK_END")
          normalized=lock.replace('candleInterval = "15minute"','candleInterval = "5minute"').replace(
              "FixedLocalStrategyEngine.buildFeatures(quote, historical, 15)",
              "FixedLocalStrategyEngine.buildFeatures(quote, historical, 5)"
          ).replace('"fixed_15minute_forecast_1minute"','"fixed_5minute_forecast_1minute"')
          assert normalized == previous_lock, "Fixed lock changed beyond v7.9.1 input restoration"
          for expected in ("forecastNewsJournal.archive()", "forecastNewsJournal.restore(",
                           "auditLogger.restoreArchived(", "finalizeMultifyPositivePattern(",
                           "monitorForecastNewsOutcomes()", "forecastLiveUnlocked(): Boolean = true",
                           'candleInterval = "5minute"'):
              assert expected in src, expected
          # Exact v7.9.1 (Oct 26 successful build) engine: the one extra
          # diagnostic field exists only to retain Kotlin source compatibility.
          engine=(root/"engine/FixedLocalStrategyEngine.kt").read_text()
          diagnostic="    val candles: List<FixedCandle>,\\n    val sessionCandleCount: Int = 0 // binary compatibility for unused diagnostic overlay\\n)"
          assert diagnostic in engine, "Unexpected Fixed engine diagnostic field"
          legacy=engine.replace(diagnostic,"    val candles: List<FixedCandle>\\n)")
          import hashlib
          assert hashlib.sha256(legacy.encode()).hexdigest()=="40eb2a6ff6f9c595cfa4d5c114bfef5f4a07bc7ffcadeb9b0fb4b16e7ed75b52", "Fixed v7.9.1 core source mismatch"
          section=src.split("// FIXED_FINAL_LOCK_BEGIN:",1)[1].split("// FIXED_FINAL_LOCK_END:",1)[0]
          assert section.count('candleInterval = "15minute"') == 2
          assert 'FixedLocalStrategyEngine.buildFeatures(quote, historical, 15)' in section
          assert 'candleInterval = "5minute"' not in section
          ui=(root/"ui/screens/TraderApp.kt").read_text()
          assert "Safety holds and confirmation queue" not in ui
          prefs=(root/"data/preferences/AppPreferences.kt").read_text()
          assert 'disableAutomaticEntriesOnceForV7931()' in prefs
          for off in ("armEnabled","fixedAutoBuyEnabled","forecastAutoBuyEnabled"):
              assert f'it[Keys.{off}] = false' in prefs
          assert 'runBlocking(Dispatchers.IO) { preferences.disableAutomaticEntriesOnceForV7931() }' in (root/"MultifyApp.kt").read_text()
          changed=set(subprocess.check_output(["git","diff","--name-only","origin/v7930-forecast-replay-candle-parser...HEAD"]).decode().splitlines())
          authorized={
              "app/src/main/java/com/multify/traderpro/engine/FixedLocalStrategyEngine.kt",
              "app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt",
              "app/src/main/java/com/multify/traderpro/ui/screens/TraderApp.kt",
              "app/src/main/java/com/multify/traderpro/data/preferences/AppPreferences.kt",
              "app/src/main/java/com/multify/traderpro/MultifyApp.kt",
              "app/src/test/java/com/multify/traderpro/engine/FixedSessionFeatureTest.kt",
              "app/build.gradle.kts",
              ".github/workflows/multify-v7931-verified.yml"
          }
          assert changed <= authorized, "Unexpected changed files: "+str(changed-authorized)
          for x in ("engine/FixedFinalContract.kt","engine/FixedForecastQualityPolicy.kt",
                    "engine/FixedForecastPublicationPolicy.kt","engine/FixedMultifyFactorFamilies.kt",
                    "engine/FixedMarketDiscoveryPolicy.kt","engine/HardStopLossPolicy.kt",
                    "engine/SteppedTrailingPolicy.kt","data/network/BetaReadOnlyInterceptor.kt",
                    "engine/ForecastPublicationPolicy.kt"):
              path="app/src/main/java/com/multify/traderpro/"+x
              assert Path(path).read_text()==previous(path),"Changed protected file: "+x
          assert 'versionCode = 7931' in Path("app/build.gradle.kts").read_text()
          print("Fixed immutable selection, Beta isolation, broker SELL and v7931 Fixed v791 factor parity and opt-in entry toggles verified")
          PY
      - name: Backend tests
        shell: bash
        run: |
          python -m pip install -r backend/requirements.txt
          PYTHONPATH="$GITHUB_WORKSPACE" PHONE_HMAC_SECRET=test-secret-test-secret-test-secret GROWW_API_KEY=test-api-key GROWW_TOTP_SECRET=JBSWY3DPEHPK3PXP python -m pytest -q backend/tests
      - name: Android unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Verify signature, APK identity, source checksum
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Multify-TraderPro-v7.9.31-fixed-v791-input-restored-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/*.apk > dist/APK-SIGNATURE.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/*.apk | head -n 2 > dist/PACKAGE.txt
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          git rev-parse HEAD > dist/SOURCE-COMMIT.txt
          python - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('dist/Multify-TraderPro-v7.9.31-source.zip','w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in Path('.').rglob('*'):
                  if not p.is_file():continue
                  if any(part in {'.git','.gradle','build','dist','__pycache__','.pytest_cache'} for part in p.parts):continue
                  if p.suffix.lower() in {'.jks','.keystore'} or p.name.startswith('.env'):continue
                  z.write(p,p.as_posix())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multify-v7931-fixed-parity
          path: dist/
          if-no-files-found: warn
