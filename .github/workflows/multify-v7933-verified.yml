name: Multify v7.9.33 Univest Same-day 48 Factor Forecast Verified
on:
  push:
    branches: [v7933-univest-sameday-48-learning]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Verify Fixed baseline, independent Alpha-Beta and execution safety
        run: |
          set -euo pipefail
          git fetch --no-tags origin v7932-nse-news-early-catalyst-learning
          python - <<'PY'
          from pathlib import Path
          import subprocess
          root = Path("app/src/main/java/com/multify/traderpro")
          def previous(path):
              return subprocess.check_output(["git","show",f"origin/v7932-nse-news-early-catalyst-learning:{path}"]).decode()
          unchanged=[
              "engine/FixedForecastQualityPolicy.kt",
              "engine/FixedMarketDiscoveryPolicy.kt",
              "engine/FixedForecastPublicationPolicy.kt",
              "engine/FixedMultifyFactorFamilies.kt",
              "engine/FixedFinalContract.kt",
              "engine/HardStopLossPolicy.kt",
              "engine/SteppedTrailingPolicy.kt",
              "data/network/GrowwApiFactory.kt",
              "data/network/BetaReadOnlyInterceptor.kt",
              "data/network/BetaResearchGate.kt",
              "data/network/GrowwRateLimitInterceptor.kt",
              "data/network/GrowwModels.kt",
              "engine/ForecastEarlyEntryPolicy.kt",
              "engine/ForecastEntryTimingPolicy.kt",
              "engine/ForecastPublicationPolicy.kt",
              "engine/LocalStrategyEngine.kt"
          ]
          for name in unchanged:
              path="app/src/main/java/com/multify/traderpro/"+name
              assert Path(path).read_text()==previous(path),name+" changed unexpectedly"
          src=(root/"data/repository/TradingRepository.kt").read_text()
          prior=previous("app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt")
          def region(s,a,b):
              x=s.index(a);y=s.index(b,x+len(a))
              return s[x:y+len(b)]
          lock=region(src,"// FIXED_FINAL_LOCK_BEGIN","// FIXED_FINAL_LOCK_END")
          previous_lock=region(prior,"// FIXED_FINAL_LOCK_BEGIN","// FIXED_FINAL_LOCK_END")
          assert lock == previous_lock, "Fixed frozen selection source changed"
          for expected in ("forecastNewsJournal.archive()", "forecastNewsJournal.restore(",
                           "auditLogger.restoreArchived(", "finalizeMultifyPositivePattern(",
                           "monitorForecastNewsOutcomes()", "forecastLiveUnlocked(): Boolean = true",
                           'candleInterval = "5minute"'):
              assert expected in src, expected
          # Exact v7.9.1 (Oct 26 successful build) engine: the one extra
          # diagnostic field exists only to retain Kotlin source compatibility.
          engine=(root/"engine/FixedLocalStrategyEngine.kt").read_text()
          diagnostic="    val candles: List<FixedCandle>,\n    val sessionCandleCount: Int = 0 // binary compatibility for unused diagnostic overlay\n)"
          assert diagnostic in engine, "Unexpected Fixed engine diagnostic field"
          legacy=engine.replace(diagnostic,"    val candles: List<FixedCandle>\n)")
          import hashlib
          assert hashlib.sha256(legacy.encode()).hexdigest()=="40eb2a6ff6f9c595cfa4d5c114bfef5f4a07bc7ffcadeb9b0fb4b16e7ed75b52", "Fixed v7.9.1 core source mismatch"
          section=src.split("// FIXED_FINAL_LOCK_BEGIN:",1)[1].split("// FIXED_FINAL_LOCK_END:",1)[0]
          assert section.count('candleInterval = "15minute"') == 2
          assert 'FixedLocalStrategyEngine.buildFeatures(quote, historical, 15)' in section
          assert 'candleInterval = "5minute"' not in section
          ui=(root/"ui/screens/TraderApp.kt").read_text()
          assert "Safety holds and confirmation queue" not in ui
          prefs=(root/"data/preferences/AppPreferences.kt").read_text()
          assert 'disableAutomaticEntriesOnceForV7931()' in prefs
          for off in ("armEnabled","fixedAutoBuyEnabled","forecastAutoBuyEnabled"):
              assert f'it[Keys.{off}] = false' in prefs
          assert 'runBlocking(Dispatchers.IO) { preferences.disableAutomaticEntriesOnceForV7931() }' in (root/"MultifyApp.kt").read_text()
          changed=set(subprocess.check_output(["git","diff","--name-only","origin/v7932-nse-news-early-catalyst-learning...HEAD"]).decode().splitlines())
          authorized={
              "app/src/main/java/com/multify/traderpro/engine/ForecastNewsOpportunityPolicy.kt",
              "app/src/main/java/com/multify/traderpro/engine/ForecastNewsPatternPolicy.kt",
              "app/src/main/java/com/multify/traderpro/data/repository/ForecastNewsJournal.kt",
              "app/src/main/java/com/multify/traderpro/data/repository/ForecastNewsMonitor.kt",
              "app/src/main/java/com/multify/traderpro/data/repository/TradingRepository.kt",
              "app/src/main/java/com/multify/traderpro/data/repository/ForecastUnivestJournal.kt",
              "app/src/main/java/com/multify/traderpro/engine/ForecastUnivestLearningPolicy.kt",
              "app/src/main/java/com/multify/traderpro/service/MultifyNotificationListenerService.kt",
              "app/src/main/java/com/multify/traderpro/ui/screens/TraderApp.kt",
              "app/src/test/java/com/multify/traderpro/engine/ForecastUnivestLearningPolicyTest.kt",
              "app/src/test/java/com/multify/traderpro/engine/ForecastNewsOpportunityPolicyTest.kt",
              "app/build.gradle.kts",
              ".github/workflows/multify-v7933-verified.yml"
          }
          assert changed <= authorized, "Unexpected changed files: "+str(changed-authorized)
          for x in ("engine/FixedFinalContract.kt","engine/FixedForecastQualityPolicy.kt",
                    "engine/FixedForecastPublicationPolicy.kt","engine/FixedMultifyFactorFamilies.kt",
                    "engine/FixedMarketDiscoveryPolicy.kt","engine/HardStopLossPolicy.kt",
                    "engine/SteppedTrailingPolicy.kt","data/network/BetaReadOnlyInterceptor.kt",
                    "engine/ForecastPublicationPolicy.kt"):
              path="app/src/main/java/com/multify/traderpro/"+x
              assert Path(path).read_text()==previous(path),"Changed protected file: "+x
          assert 'versionCode = 7933' in Path("app/build.gradle.kts").read_text()
          assert '"Safety holds and confirmation queue"' not in ui
          news = (root/"data/repository/TradingRepository.kt").read_text()
          assert '"EARLY_CATALYST_DECISION"' in news
          assert '"CONTEXTUAL_PATTERN_LEARNING"' in news
          assert 'ForecastNewsOpportunityPolicy' in news
          assert '"NSE"' in (root/"data/repository/ForecastNewsMonitor.kt").read_text()
          assert 'BSE_' not in (root/"data/repository/ForecastNewsMonitor.kt").read_text()
          assert 'MIN_PATTERN_HIT_RATE = 0.75' in (root/"engine/ForecastNewsOpportunityPolicy.kt").read_text()
          assert 'disableAutomaticEntriesOnceForV7931()' in prefs
          univest = (root/"engine/ForecastUnivestLearningPolicy.kt").read_text()
          assert 'OFFICIAL_PACKAGE = "com.univest.capp"' in univest
          assert 'PARAMETER_COUNT = 48' in univest
          assert 'MIN_WIN_RATE = 0.75' in univest
          journal = (root/"data/repository/ForecastUnivestJournal.kt").read_text()
          assert 'sameTradingDay' in journal and 'CLOSED_SAME_DAY_VERIFIED' in journal
          listener = (root/"service/MultifyNotificationListenerService.kt").read_text()
          assert 'repository.captureUnivestNotification' in listener
          assert 'return\n        }\n        val parsed = parser.parse' in listener
          assert 'forecastUnivestJournal.archive()' in src and 'forecastUnivestJournal.restore(' in src
          assert 'univestBonus' in src and 'ForecastUnivestLearningPolicy.fingerprint' in src
          print("v7933 Univest same-day research only: Fixed, Alpha/Beta separation, SELL and entry defaults preserved")
          PY
      - name: Backend tests
        shell: bash
        run: |
          python -m pip install -r backend/requirements.txt
          PYTHONPATH="$GITHUB_WORKSPACE" PHONE_HMAC_SECRET=test-secret-test-secret-test-secret GROWW_API_KEY=test-api-key GROWW_TOTP_SECRET=JBSWY3DPEHPK3PXP python -m pytest -q backend/tests
      - name: Android unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Verify signature, APK identity, source checksum
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Multify-TraderPro-v7.9.33-univest-sameday-48-learning-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/*.apk > dist/APK-SIGNATURE.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/*.apk | head -n 2 > dist/PACKAGE.txt
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          git rev-parse HEAD > dist/SOURCE-COMMIT.txt
          python - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('dist/Multify-TraderPro-v7.9.33-source.zip','w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in Path('.').rglob('*'):
                  if not p.is_file():continue
                  if any(part in {'.git','.gradle','build','dist','__pycache__','.pytest_cache'} for part in p.parts):continue
                  if p.suffix.lower() in {'.jks','.keystore'} or p.name.startswith('.env'):continue
                  z.write(p,p.as_posix())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multify-v7933-univest-sameday-learning
          path: dist/
          if-no-files-found: warn
