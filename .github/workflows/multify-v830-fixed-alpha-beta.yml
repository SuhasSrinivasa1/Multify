          assert 'FIXED_V741_FORECAST_SCAN_INTERVAL_MS = 90_000L' in live
          assert part(orig,'suspend fun generateFixedForecasts(',
                      'private fun fixedSnapshotMultifyMfeAverage(')==part(
                         live,'suspend fun generateFixedForecasts(',
                         'private fun fixedSnapshotMultifyMfeAverage(')
          assert part(orig,'private suspend fun fixedForecastEvaluationUsingAccount(',
                      'suspend fun prepareNextFixedDiscoverySweep(')==part(
                         live,'private suspend fun fixedForecastEvaluationUsingAccount(',
                         'suspend fun prepareNextFixedDiscoverySweep(')
          assert part(orig,'private suspend fun fetchFixedDiscoveryLtpBatch(',
                      '// FIXED_FINAL_LOCK_END:')==part(
                         live,'private suspend fun fetchFixedDiscoveryLtpBatch(',
                         '// FIXED_FINAL_LOCK_END:')
          for file in (
             root+'engine/FixedLocalStrategyEngine.kt',
             root+'engine/FixedMultifyFactorFamilies.kt',
             root+'engine/FixedForecastQualityPolicy.kt',
             root+'engine/FixedMarketDiscoveryPolicy.kt',
             root+'engine/FixedFinalContract.kt',
             root+'engine/FixedRepeatQualificationPolicy.kt',
             root+'engine/FixedEntryActionabilityPolicy.kt',
             root+'engine/NseEquitySessionCalendar.kt',
             root+'engine/SteppedTrailingPolicy.kt',
             root+'engine/FixedDualAccountPolicy.kt',
             root+'data/network/GrowwApi.kt',
          ):
