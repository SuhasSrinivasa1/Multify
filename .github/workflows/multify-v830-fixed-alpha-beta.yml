          assert 'placeCncBuy(' not in trace
          assert 'fixedRecommendationStore.upsert(' not in trace
          assert 'submitMarketOrder(' not in trace
          assert 'FixedLocalStrategyEngine.evaluateLong(' not in trace
          assert 'actual_completed_scan_start_spacing_ms' in current(service)
          assert 'candle_data_quality' in current(factor)
          assert 'archivedObservations()' in current(store)
