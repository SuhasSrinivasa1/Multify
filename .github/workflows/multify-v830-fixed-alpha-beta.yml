            ['git','diff','--name-only',baseline,'HEAD'],text=True).splitlines())
          assert modified==allowed,f'Unexpected source changes: {modified ^ allowed}'
          def old(p): return subprocess.check_output(['git','show',f'{baseline}:{p}']).decode()
          def current(p): return Path(p).read_text()
          orig=old(repo); live=current(repo)
          def part(s,a,b):
            start=s.index(a);end=s.index(b,start);return s[start:end]
