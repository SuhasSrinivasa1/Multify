name: Multify v8.3.5 Fixed 90s + Minus 5% Hard Stop TEST APK
on:
  push:
    branches: [v835-hard-stop-minus-5pct-test]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Assert production Fixed and SELL unchanged from verified v8.3.3
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin v834-full-evidence-observability-test
          python - <<'PY'
          from pathlib import Path
          import subprocess
          baseline='origin/v834-full-evidence-observability-test'
          root='app/src/main/java/com/multify/traderpro/'
          repo=root+'data/repository/TradingRepository.kt'
